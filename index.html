<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAUVEY</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: #ffffff;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
}

.status {
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 8px;
    background: #222;
}

.card {
    background: #111;
    border: 1px solid #252525;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
}

h2 {
    margin-top: 0;
    font-size: 18px;
}

label {
    display: block;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #191919;
    color: white;
    outline: none;
}

input:focus,
select:focus {
    border-color: #777;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.connect {
    background: #ffffff;
    color: #000000;
}

.buy {
    background: #00c853;
    color: white;
}

.sell {
    background: #d50000;
    color: white;
}

.secondary {
    background: #292929;
    color: white;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.value {
    font-size: 20px;
    font-weight: bold;
    margin-top: 5px;
}

.trade-state {
    padding: 12px;
    border-radius: 8px;
    background: #1d1d1d;
    margin-top: 10px;
    font-size: 14px;
}

.log {
    height: 180px;
    overflow-y: auto;
    background: #050505;
    border-radius: 8px;
    padding: 10px;
    font-family: monospace;
    font-size: 11px;
    color: #aaa;
    white-space: pre-wrap;
}

.row {
    display: flex;
    gap: 10px;
}

.row > * {
    flex: 1;
}

.price {
    font-size: 30px;
    font-weight: bold;
}

.small {
    font-size: 12px;
    color: #888;
}

@media (max-width: 650px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .row {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">MAUVEY</div>
        <div id="connectionStatus" class="status">
            NOT CONNECTED
        </div>
    </div>


    <!-- ACCOUNT -->

    <div class="card">

        <h2>Deriv Account</h2>

        <label>API Token</label>

        <input
            id="apiToken"
            type="password"
            placeholder="Enter Deriv API token"
        >

        <button
            id="connectButton"
            class="connect"
            onclick="connectDeriv()"
        >
            CONNECT
        </button>

        <button
            id="disconnectButton"
            class="secondary"
            onclick="disconnectDeriv()"
            disabled
        >
            DISCONNECT
        </button>

    </div>


    <!-- MARKET -->

    <div class="card">

        <h2>Market</h2>

        <label>Market</label>

        <select id="marketSelect">
            <option value="R_100">Volatility 100 Index</option>
            <option value="R_75">Volatility 75 Index</option>
            <option value="R_50">Volatility 50 Index</option>
            <option value="R_25">Volatility 25 Index</option>
            <option value="R_10">Volatility 10 Index</option>
        </select>

        <div class="trade-state">
            <div class="small">CURRENT PRICE</div>
            <div id="currentPrice" class="price">--</div>
        </div>

    </div>


    <!-- TRADE SETTINGS -->

    <div class="card">

        <h2>Trade Settings</h2>

        <div class="grid">

            <div>
                <label>Stake</label>

                <input
                    id="stake"
                    type="number"
                    value="1"
                    min="0.35"
                    step="0.01"
                >
            </div>

            <div>
                <label>Duration</label>

                <input
                    id="duration"
                    type="number"
                    value="1"
                    min="1"
                    step="1"
                >
            </div>

        </div>


        <div style="margin-top:12px">

            <label>Duration Unit</label>

            <select id="durationUnit">
                <option value="t">Ticks</option>
                <option value="s">Seconds</option>
                <option value="m">Minutes</option>
            </select>

        </div>


        <div style="margin-top:12px">

            <label>Contract Type</label>

            <select id="contractType">

                <option value="CALL">
                    Rise
                </option>

                <option value="PUT">
                    Fall
                </option>

            </select>

        </div>

    </div>


    <!-- ACCOUNT INFORMATION -->

    <div class="card">

        <h2>Account</h2>

        <div class="grid">

            <div>
                <div class="small">BALANCE</div>
                <div id="balance" class="value">--</div>
            </div>

            <div>
                <div class="small">CURRENCY</div>
                <div id="currency" class="value">--</div>
            </div>

        </div>

    </div>


    <!-- TRADE -->

    <div class="card">

        <h2>Trade</h2>

        <div id="tradeState" class="trade-state">
            Waiting for connection.
        </div>

        <button
            id="tradeButton"
            class="buy"
            onclick="placeTrade()"
            disabled
        >
            PLACE TRADE
        </button>

    </div>


    <!-- ACTIVE CONTRACT -->

    <div class="card">

        <h2>Active Contract</h2>

        <div class="grid">

            <div>
                <div class="small">CONTRACT ID</div>
                <div id="contractId" class="value">--</div>
            </div>

            <div>
                <div class="small">STATUS</div>
                <div id="contractStatus" class="value">--</div>
            </div>

            <div>
                <div class="small">BUY PRICE</div>
                <div id="buyPrice" class="value">--</div>
            </div>

            <div>
                <div class="small">CURRENT VALUE</div>
                <div id="contractValue" class="value">--</div>
            </div>

        </div>

    </div>


    <!-- LOG -->

    <div class="card">

        <h2>Activity</h2>

        <div id="log" class="log"></div>

    </div>

</div>


<script>

/* =========================================================
   MAUVEY DERIV TRADING ENGINE
   ========================================================= */


/* ---------------------------------------------------------
   GLOBAL VARIABLES
   --------------------------------------------------------- */

let accountWS = null;

let accountToken = "";

let accountCurrency = "";

let accountBalance = 0;

let currentContractId = null;

let tradeInProgress = false;

let currentPrice = null;

let requestCounter = 1;


/* ---------------------------------------------------------
   DERIV APP ID
   --------------------------------------------------------- */

const DERIV_APP_ID = "1089";


/* ---------------------------------------------------------
   ELEMENTS
   --------------------------------------------------------- */

const tokenInput =
    document.getElementById("apiToken");

const connectButton =
    document.getElementById("connectButton");

const disconnectButton =
    document.getElementById("disconnectButton");

const connectionStatus =
    document.getElementById("connectionStatus");

const marketSelect =
    document.getElementById("marketSelect");

const currentPriceElement =
    document.getElementById("currentPrice");

const balanceElement =
    document.getElementById("balance");

const currencyElement =
    document.getElementById("currency");

const tradeButton =
    document.getElementById("tradeButton");

const tradeState =
    document.getElementById("tradeState");

const contractIdElement =
    document.getElementById("contractId");

const contractStatusElement =
    document.getElementById("contractStatus");

const buyPriceElement =
    document.getElementById("buyPrice");

const contractValueElement =
    document.getElementById("contractValue");

const logElement =
    document.getElementById("log");


/* ---------------------------------------------------------
   REQUEST ID
   --------------------------------------------------------- */

function nextRequestId() {

    requestCounter++;

    return requestCounter;
}


/* ---------------------------------------------------------
   LOG
   --------------------------------------------------------- */

function log(message) {

    const time =
        new Date().toLocaleTimeString();

    logElement.textContent +=
        "[" + time + "] " +
        message +
        "\n";

    logElement.scrollTop =
        logElement.scrollHeight;
}


/* ---------------------------------------------------------
   CONNECTION STATUS
   --------------------------------------------------------- */

function setConnectionStatus(
    text,
    connected
) {

    connectionStatus.textContent =
        text;

    if (connected) {

        connectionStatus.style.background =
            "#063d20";

    } else {

        connectionStatus.style.background =
            "#222";

    }
}


/* ---------------------------------------------------------
   TRADE STATUS
   --------------------------------------------------------- */

function setTradeState(message) {

    tradeState.textContent =
        message;

}


/* ---------------------------------------------------------
   CONNECT
   --------------------------------------------------------- */

function connectDeriv() {

    const token =
        tokenInput.value.trim();


    if (!token) {

        alert(
            "Enter your Deriv API token first."
        );

        return;
    }


    disconnectDeriv();


    accountToken = token;


    setConnectionStatus(
        "CONNECTING...",
        false
    );


    log("Connecting to Deriv...");


    const url =
        "wss://ws.derivws.com/websockets/v3" +
        "?app_id=" +
        DERIV_APP_ID;


    try {

        accountWS =
            new WebSocket(url);

    } catch (error) {

        log(
            "WebSocket error: " +
            error.message
        );

        setConnectionStatus(
            "CONNECTION ERROR",
            false
        );

        return;
    }


    accountWS.onopen =
        function() {

            log(
                "WebSocket connected."
            );

            authorizeAccount();

        };


    accountWS.onmessage =
        function(event) {

            handleMessage(
                event.data
            );

        };


    accountWS.onerror =
        function(error) {

            log(
                "WebSocket error."
            );

            setConnectionStatus(
                "ERROR",
                false
            );

        };


    accountWS.onclose =
        function() {

            log(
                "WebSocket closed."
            );

            setConnectionStatus(
                "DISCONNECTED",
                false
            );

            tradeButton.disabled =
                true;

            disconnectButton.disabled =
                true;

            connectButton.disabled =
                false;

        };

}


/* ---------------------------------------------------------
   AUTHORIZE
   --------------------------------------------------------- */

function authorizeAccount() {

    if (
        !accountWS ||
        accountWS.readyState !== WebSocket.OPEN
    ) {

        return;
    }


    log(
        "Authorizing account..."
    );


    accountWS.send(
        JSON.stringify({

            authorize:
                accountToken,

            req_id:
                nextRequestId()

        })
    );

}


/* ---------------------------------------------------------
   MESSAGE HANDLER
   --------------------------------------------------------- */

function handleMessage(raw) {

    let data;


    try {

        data =
            JSON.parse(raw);

    } catch (error) {

        log(
            "Invalid server message."
        );

        return;
    }


    if (data.error) {

        handleDerivError(
            data
        );

        return;
    }


    if (data.authorize) {

        handleAuthorization(
            data.authorize
        );

        return;
    }


    if (data.balance) {

        handleBalance(
            data.balance
        );

        return;
    }


    if (data.tick) {

        handleTick(
            data.tick
        );

        return;
    }


    if (data.proposal) {

        handleProposal(
            data.proposal
        );

        return;
    }


    if (data.buy) {

        handleBuy(
            data.buy
        );

        return;
    }


    if (data.proposal_open_contract) {

        handleContract(
            data.proposal_open_contract
        );

        return;
    }

}


/* ---------------------------------------------------------
   AUTHORIZATION RESPONSE
   --------------------------------------------------------- */

function handleAuthorization(
    authorization
) {

    log(
        "Account authorized."
    );


    accountCurrency =
        authorization.currency ||
        "";


    accountBalance =
        Number(
            authorization.balance || 0
        );


    balanceElement.textContent =
        accountBalance.toFixed(2);


    currencyElement.textContent =
        accountCurrency;


    setConnectionStatus(
        "CONNECTED",
        true
    );


    connectButton.disabled =
        true;

    disconnectButton.disabled =
        false;

    tradeButton.disabled =
        false;


    setTradeState(
        "Ready to trade."
    );


    subscribeToMarket();


    subscribeToBalance();


    log(
        "Currency: " +
        accountCurrency
    );


    log(
        "Balance: " +
        accountBalance
    );

}


/* ---------------------------------------------------------
   BALANCE SUBSCRIPTION
   --------------------------------------------------------- */

function subscribeToBalance() {

    if (!accountWS) {
        return;
    }


    accountWS.send(
        JSON.stringify({

            balance: 1,

            subscribe: 1,

            req_id:
                nextRequestId()

        })
    );

}


/* ---------------------------------------------------------
   BALANCE
   --------------------------------------------------------- */

function handleBalance(
    balance
) {

    accountBalance =
        Number(
            balance.balance || 0
        );


    balanceElement.textContent =
        accountBalance.toFixed(2);


    if (balance.currency) {

        accountCurrency =
            balance.currency;

        currencyElement.textContent =
            accountCurrency;

    }

}


/* ---------------------------------------------------------
   MARKET SUBSCRIPTION
   --------------------------------------------------------- */

function subscribeToMarket() {

    if (
        !accountWS ||
        accountWS.readyState !== WebSocket.OPEN
    ) {

        return;
    }


    const symbol =
        marketSelect.value;


    log(
        "Subscribing to " +
        symbol
    );


    accountWS.send(
        JSON.stringify({

            forget_all:
                "ticks"

        })
    );


    accountWS.send(
        JSON.stringify({

            ticks:
                symbol,

            subscribe:
                1,

            req_id:
                nextRequestId()

        })
    );

}


/* ---------------------------------------------------------
   MARKET CHANGE
   --------------------------------------------------------- */

marketSelect.addEventListener(
    "change",
    function() {

        if (
            accountWS &&
            accountWS.readyState ===
            WebSocket.OPEN
        ) {

            subscribeToMarket();

        }

    }
);


/* ---------------------------------------------------------
   TICK
   --------------------------------------------------------- */

function handleTick(tick) {

    currentPrice =
        Number(tick.quote);


    currentPriceElement.textContent =
        formatPrice(currentPrice);

}


/* ---------------------------------------------------------
   PRICE FORMAT
   --------------------------------------------------------- */

function formatPrice(price) {

    if (
        price === null ||
        price === undefined ||
        Number.isNaN(price)
    ) {

        return "--";

    }


    return Number(price)
        .toFixed(2);

}


/* ---------------------------------------------------------
   PLACE TRADE
   --------------------------------------------------------- */

function placeTrade() {

    if (
        !accountWS ||
        accountWS.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            "Connect your Deriv account first."
        );

        return;
    }


    if (tradeInProgress) {

        alert(
            "A trade is already in progress."
        );

        return;
    }


    const stake =
        Number(
            document.getElementById(
                "stake"
            ).value
        );


    const duration =
        Number(
            document.getElementById(
                "duration"
            ).value
        );


    const durationUnit =
        document.getElementById(
            "durationUnit"
        ).value;


    const contractType =
        document.getElementById(
            "contractType"
        ).value;


    const symbol =
        marketSelect.value;


    if (!(stake > 0)) {

        alert(
            "Enter a valid stake."
        );

        return;
    }


    if (!(duration > 0)) {

        alert(
            "Enter a valid duration."
        );

        return;
    }


    if (!accountCurrency) {

        alert(
            "Account currency is not available."
        );

        return;
    }


    tradeInProgress =
        true;


    tradeButton.disabled =
        true;


    setTradeState(
        "REQUESTING PROPOSAL..."
    );


    log(
        "Requesting proposal..."
    );


    const proposal = {

        proposal: 1,

        amount: stake,

        basis: "stake",

        contract_type:
            contractType,

        currency:
            accountCurrency,

        duration:
            duration,

        duration_unit:
            durationUnit,

        underlying_symbol:
            symbol,

        req_id:
            nextRequestId()

    };


    log(
        "Market: " +
        symbol
    );


    log(
        "Type: " +
        contractType
    );


    log(
        "Stake: " +
        stake
    );


    accountWS.send(
        JSON.stringify(proposal)
    );

}


/* ---------------------------------------------------------
   PROPOSAL
   --------------------------------------------------------- */

function handleProposal(
    proposal
) {

    log(
        "Proposal received."
    );


    if (!proposal.id) {

        failTrade(
            "Proposal did not contain an ID."
        );

        return;
    }


    setTradeState(
        "BUYING CONTRACT..."
    );


    const buyRequest = {

        buy:
            proposal.id,

        price:
            Number(
                proposal.ask_price
            ),

        req_id:
            nextRequestId()

    };


    log(
        "Buying contract..."
    );


    accountWS.send(
        JSON.stringify(
            buyRequest
        )
    );

}


/* ---------------------------------------------------------
   BUY RESPONSE
   --------------------------------------------------------- */

function handleBuy(
    buy
) {

    if (!buy.contract_id) {

        failTrade(
            "Buy response did not contain contract ID."
        );

        return;
    }


    currentContractId =
        buy.contract_id;


    contractIdElement.textContent =
        currentContractId;


    buyPriceElement.textContent =
        formatPrice(
            Number(buy.buy_price)
        );


    contractStatusElement.textContent =
        "OPEN";


    setTradeState(
        "TRADE OPEN"
    );


    log(
        "Contract bought: " +
        currentContractId
    );


    subscribeToContract(
        currentContractId
    );

}


/* ---------------------------------------------------------
   CONTRACT SUBSCRIPTION
   --------------------------------------------------------- */

function subscribeToContract(
    contractId
) {

    if (
        !accountWS ||
        accountWS.readyState !==
        WebSocket.OPEN
    ) {

        return;
    }


    accountWS.send(
        JSON.stringify({

            proposal_open_contract:
                1,

            contract_id:
                contractId,

            subscribe:
                1,

            req_id:
                nextRequestId()

        })
    );


    log(
        "Monitoring contract..."
    );

}


/* ---------------------------------------------------------
   CONTRACT UPDATE
   --------------------------------------------------------- */

function handleContract(
    contract
) {

    if (
        contract.contract_id &&
        currentContractId &&
        String(contract.contract_id) !==
        String(currentContractId)
    ) {

        return;
    }


    const status =
        contract.status || "";


    const profit =
        contract.profit !== undefined
            ? Number(contract.profit)
            : null;


    const currentValue =
        contract.bid_price !== undefined
            ? Number(contract.bid_price)
            : null;


    if (currentValue !== null) {

        contractValueElement.textContent =
            formatPrice(currentValue);

    }


    if (status) {

        contractStatusElement.textContent =
            status.toUpperCase();

    }


    if (
        contract.is_sold ||
        status === "won" ||
        status === "lost" ||
        status === "sold"
    ) {

        finishTrade(
            contract
        );

    } else {

        if (profit !== null) {

            setTradeState(
                "TRADE OPEN | P/L: " +
                profit.toFixed(2)
            );

        } else {

            setTradeState(
                "TRADE OPEN"
            );

        }

    }

}


/* ---------------------------------------------------------
   FINISH TRADE
   --------------------------------------------------------- */

function finishTrade(
    contract
) {

    tradeInProgress =
        false;


    tradeButton.disabled =
        false;


    const status =
        contract.status || "";


    const profit =
        contract.profit !== undefined
            ? Number(contract.profit)
            : 0;


    if (status === "won") {

        setTradeState(
            "TRADE WON: +" +
            profit.toFixed(2)
        );


    } else if (
        status === "lost"
    ) {

        setTradeState(
            "TRADE LOST: " +
            profit.toFixed(2)
        );


    } else {

        setTradeState(
            "TRADE FINISHED"
        );

    }


    log(
        "Contract finished."
    );


    log(
        "Result: " +
        status
    );


    log(
        "Profit/Loss: " +
        profit.toFixed(2)
    );


    currentContractId =
        null;

}


/* ---------------------------------------------------------
   TRADE ERROR
   --------------------------------------------------------- */

function failTrade(
    message
) {

    tradeInProgress =
        false;


    tradeButton.disabled =
        false;


    setTradeState(
        "ERROR: " +
        message
    );


    log(
        "Trade error: " +
        message
    );

}


/* ---------------------------------------------------------
   DERIV ERROR
   --------------------------------------------------------- */

function handleDerivError(
    data
) {

    const message =
        data.error &&
        data.error.message
            ? data.error.message
            : "Unknown Deriv error.";


    log(
        "DERIV ERROR: " +
        message
    );


    if (
        tradeInProgress
    ) {

        failTrade(
            message
        );

    } else {

        setTradeState(
            "ERROR: " +
            message
        );

    }


    if (
        data.error &&
        data.error.code ===
        "AuthorizationRequired"
    ) {

        setConnectionStatus(
            "NOT AUTHORIZED",
            false
        );

    }

}


/* ---------------------------------------------------------
   DISCONNECT
   --------------------------------------------------------- */

function disconnectDeriv() {

    if (accountWS) {

        try {

            accountWS.close();

        } catch (error) {

            console.log(error);

        }

    }


    accountWS =
        null;


    accountToken =
        "";

    accountCurrency =
        "";

    accountBalance =
        0;

    currentContractId =
        null;

    tradeInProgress =
        false;


    setConnectionStatus(
        "NOT CONNECTED",
        false
    );


    balanceElement.textContent =
        "--";


    currencyElement.textContent =
        "--";


    currentPriceElement.textContent =
        "--";


    contractIdElement.textContent =
        "--";


    contractStatusElement.textContent =
        "--";


    buyPriceElement.textContent =
        "--";


    contractValueElement.textContent =
        "--";


    tradeButton.disabled =
        true;


    disconnectButton.disabled =
        true;


    connectButton.disabled =
        false;


    setTradeState(
        "Waiting for connection."
    );


    log(
        "Disconnected."
    );

}


/* ---------------------------------------------------------
   INITIAL STATE
   --------------------------------------------------------- */

tradeButton.disabled =
    true;

disconnectButton.disabled =
    true;


log(
    "MAUVEY ready."
);


log(
    "Enter your Deriv API token and connect."
);

</script>

</body>
</html>
