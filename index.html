<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAUVEY</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080b12;
            color: #ffffff;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: #9da6b5;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #555;
        }

        .status-dot.running {
            background: #20d47b;
            box-shadow: 0 0 10px rgba(32, 212, 123, .7);
        }

        .card {
            background: #111722;
            border: 1px solid #1e2633;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 11px;
            color: #7f8a9d;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            margin-bottom: 12px;
        }

        .market-name {
            font-size: 21px;
            font-weight: 700;
        }

        .symbol {
            margin-top: 5px;
            color: #8994a7;
            font-size: 13px;
        }

        .phase {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #0b0f17;
            color: #d9dee8;
            font-size: 14px;
        }

        .checks {
            margin-top: 12px;
        }

        .check-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1c2330;
            font-size: 14px;
        }

        .check-row:last-child {
            border-bottom: none;
        }

        .check-value {
            font-weight: 700;
        }

        .waiting {
            color: #8994a7;
        }

        .good {
            color: #20d47b;
        }

        .bad {
            color: #ff5364;
        }

        .neutral {
            color: #f1c75b;
        }

        .entry-box {
            border: 1px solid #20d47b;
            background: rgba(32, 212, 123, .06);
        }

        .entry-title {
            color: #20d47b;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .entry-line {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            font-size: 14px;
        }

        .entry-line span:first-child {
            color: #8b95a7;
        }

        .batch-number {
            font-size: 32px;
            font-weight: 800;
        }

        .batch-label {
            color: #8994a7;
            font-size: 13px;
            margin-top: 3px;
        }

        .progress {
            width: 100%;
            height: 8px;
            background: #202735;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #20d47b;
            transition: width .25s ease;
        }

        .trade {
            border-top: 1px solid #202735;
            padding: 12px 0;
        }

        .trade:first-child {
            border-top: none;
        }

        .trade-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trade-number {
            font-weight: 700;
        }

        .trade-result {
            font-weight: 800;
        }

        .trade-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin-top: 8px;
            font-size: 12px;
            color: #8994a7;
        }

        .profit {
            margin-top: 7px;
            font-size: 13px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .control-group {
            background: #0b0f17;
            padding: 12px;
            border-radius: 10px;
        }

        .control-group label {
            display: block;
            color: #8994a7;
            font-size: 11px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 17px;
            font-weight: 700;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .start {
            background: #20d47b;
            color: #06110b;
        }

        .stop {
            background: #ff5364;
            color: white;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .log {
            max-height: 230px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.7;
            color: #8f9aab;
        }

        .log-line {
            border-bottom: 1px solid #171e2a;
            padding: 4px 0;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .summary-box {
            background: #0b0f17;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .summary-number {
            font-size: 20px;
            font-weight: 800;
        }

        .summary-label {
            color: #7f8a9d;
            font-size: 10px;
            margin-top: 4px;
        }

        @media (max-width: 380px) {
            .app {
                padding: 10px;
            }

            .market-name {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">MAUVEY</div>

        <div class="status">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">STOPPED</span>
        </div>
    </div>


    <!-- CONTROLS -->

    <div class="card">

        <div class="section-title">Settings</div>

        <div class="controls">

            <div class="control-group">
                <label>RUNS PER BATCH</label>
                <input
                    id="runsInput"
                    type="number"
                    min="1"
                    value="10"
                >
            </div>

            <div class="control-group">
                <label>STAKE</label>
                <input
                    id="stakeInput"
                    type="number"
                    min="0.35"
                    step="0.01"
                    value="1.00"
                >
            </div>

        </div>

    </div>


    <!-- CURRENT MARKET -->

    <div class="card">

        <div class="section-title">Current Market</div>

        <div id="marketName" class="market-name">
            Waiting...
        </div>

        <div id="marketSymbol" class="symbol">
            —
        </div>

        <div id="phase" class="phase">
            Analyzer stopped.
        </div>

        <div class="checks">

            <div class="check-row">
                <span>Even</span>
                <span id="evenCheck" class="check-value waiting">—</span>
            </div>

            <div class="check-row">
                <span>Odd</span>
                <span id="oddCheck" class="check-value waiting">—</span>
            </div>

            <div class="check-row">
                <span>Over</span>
                <span id="overCheck" class="check-value waiting">—</span>
            </div>

            <div class="check-row">
                <span>Under</span>
                <span id="underCheck" class="check-value waiting">—</span>
            </div>

        </div>

    </div>


    <!-- ENTRY -->

    <div id="entryCard" class="card entry-box" style="display:none;">

        <div class="entry-title">
            ✓ GOOD ENTRY FOUND
        </div>

        <div class="entry-line">
            <span>Contract</span>
            <strong id="entryContract">—</strong>
        </div>

        <div class="entry-line">
            <span>Market</span>
            <strong id="entryMarket">—</strong>
        </div>

        <div class="entry-line">
            <span>Stake</span>
            <strong id="entryStake">—</strong>
        </div>

    </div>


    <!-- BATCH -->

    <div class="card">

        <div class="section-title">Current Batch</div>

        <div class="batch-number">
            <span id="tradeNumber">0</span>
            <span style="color:#687386;">/</span>
            <span id="tradeTotal">10</span>
        </div>

        <div class="batch-label">
            Trades completed in this batch
        </div>

        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>

    </div>


    <!-- SUMMARY -->

    <div class="card">

        <div class="section-title">Batch Result</div>

        <div class="summary">

            <div class="summary-box">
                <div id="wins" class="summary-number">0</div>
                <div class="summary-label">WINS</div>
            </div>

            <div class="summary-box">
                <div id="losses" class="summary-number">0</div>
                <div class="summary-label">LOSSES</div>
            </div>

            <div class="summary-box">
                <div id="profit" class="summary-number">0.00</div>
                <div class="summary-label">PROFIT</div>
            </div>

        </div>

    </div>


    <!-- TRADE HISTORY -->

    <div class="card">

        <div class="section-title">
            Trade History
        </div>

        <div id="tradeHistory">
            No trades yet.
        </div>

    </div>


    <!-- LIVE LOG -->

    <div class="card">

        <div class="section-title">
            Live Activity
        </div>

        <div id="liveLog" class="log"></div>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            id="startButton"
            class="start"
            onclick="startMauvey()"
        >
            START
        </button>

        <button
            id="stopButton"
            class="stop"
            onclick="stopMauvey()"
        >
            STOP
        </button>

    </div>

</div>


<script>

/*
==========================================================
                    MAUVEY ENGINE
==========================================================

CORE RULE:

ANALYSIS
    ↓
GOOD ENTRY
    ↓
BATCH
    ↓
TRADE 1
    ↓
TRADE 2
    ↓
TRADE 3
    ↓
...
    ↓
TRADE N
    ↓
BATCH COMPLETE
    ↓
NEW ANALYSIS
    ↓
NEW ENTRY
    ↓
NEW BATCH

IMPORTANT:

A WIN DOES NOT STOP THE BATCH.

A LOSS DOES NOT STOP THE BATCH.

THE BATCH ONLY ENDS WHEN THE
CONFIGURED NUMBER OF TRADES IS COMPLETE.

NO MARTINGALE.
==========================================================
*/


const MAUVEY = {

    running: false,

    phase: "STOPPED",

    runsPerBatch: 10,

    currentTrade: 0,

    wins: 0,

    losses: 0,

    profit: 0,

    currentEntry: null,

    marketIndex: 0,

    markets: [],

    tradeHistory: []

};


/*
==========================================================
                    UI HELPERS
==========================================================
*/

function setStatus(text, running = false) {

    document.getElementById("statusText").textContent = text;

    const dot = document.getElementById("statusDot");

    if (running) {
        dot.classList.add("running");
    } else {
        dot.classList.remove("running");
    }
}


function setPhase(text) {

    document.getElementById("phase").textContent = text;

    MAUVEY.phase = text;
}


function log(message) {

    const container = document.getElementById("liveLog");

    const line = document.createElement("div");

    line.className = "log-line";

    const time = new Date().toLocaleTimeString();

    line.textContent = `[${time}] ${message}`;

    container.prepend(line);

}


function setCheck(id, value, type = "neutral") {

    const element = document.getElementById(id);

    element.textContent = value;

    element.className = `check-value ${type}`;

}


function resetChecks() {

    setCheck("evenCheck", "—", "waiting");
    setCheck("oddCheck", "—", "waiting");
    setCheck("overCheck", "—", "waiting");
    setCheck("underCheck", "—", "waiting");

}


function updateBatchDisplay() {

    const total = MAUVEY.runsPerBatch;

    document.getElementById("tradeNumber").textContent =
        MAUVEY.currentTrade;

    document.getElementById("tradeTotal").textContent =
        total;

    const percentage =
        total > 0
        ? (MAUVEY.currentTrade / total) * 100
        : 0;

    document.getElementById("progressBar").style.width =
        `${percentage}%`;

    document.getElementById("wins").textContent =
        MAUVEY.wins;

    document.getElementById("losses").textContent =
        MAUVEY.losses;

    document.getElementById("profit").textContent =
        MAUVEY.profit.toFixed(2);

}


function showMarket(market) {

    document.getElementById("marketName").textContent =
        market.name;

    document.getElementById("marketSymbol").textContent =
        market.symbol;

}


function showEntry(entry) {

    MAUVEY.currentEntry = entry;

    document.getElementById("entryCard").style.display =
        "block";

    document.getElementById("entryContract").textContent =
        entry.contract;

    document.getElementById("entryMarket").textContent =
        entry.market.name;

    document.getElementById("entryStake").textContent =
        Number(entry.stake).toFixed(2);

}


function hideEntry() {

    document.getElementById("entryCard").style.display =
        "none";

}


function addTradeToHistory(trade) {

    const container =
        document.getElementById("tradeHistory");

    if (MAUVEY.tradeHistory.length === 1) {
        container.innerHTML = "";
    }

    const row =
        document.createElement("div");

    row.className = "trade";

    const resultClass =
        trade.result === "WON"
        ? "good"
        : "bad";

    row.innerHTML = `

        <div class="trade-top">

            <div class="trade-number">
                Trade #${trade.number}
            </div>

            <div class="trade-result ${resultClass}">
                ${trade.result}
            </div>

        </div>

        <div class="trade-info">

            <div>
                Contract: ${trade.contract}
            </div>

            <div>
                Stake: ${trade.stake.toFixed(2)}
            </div>

            <div>
                Market: ${trade.market}
            </div>

            <div>
                Profit: ${trade.profit.toFixed(2)}
            </div>

        </div>

    `;

    container.prepend(row);

}


/*
==========================================================
                 START / STOP
==========================================================
*/

function startMauvey() {

    if (MAUVEY.running) {
        return;
    }

    MAUVEY.running = true;

    MAUVEY.runsPerBatch =
        Math.max(
            1,
            Number(
                document.getElementById("runsInput").value
            )
        );

    updateBatchDisplay();

    setStatus("RUNNING", true);

    log("MAUVEY started.");

    /*
        THIS IS WHERE YOUR EXISTING DERIV
        CONNECTION SHOULD START.
    */

    beginAnalysis();

}


function stopMauvey() {

    MAUVEY.running = false;

    setStatus("STOPPED", false);

    setPhase("Analyzer stopped.");

    log("MAUVEY stopped.");

}


/*
==========================================================
                    ANALYSIS
==========================================================
*/

async function beginAnalysis() {

    if (!MAUVEY.running) {
        return;
    }

    /*
        IMPORTANT:

        ANALYSIS ONLY HAPPENS BETWEEN BATCHES.

        Once a good entry is found,
        we leave this phase and enter
        the batch.

        We DO NOT re-analyze after every trade.
    */

    MAUVEY.currentTrade = 0;

    MAUVEY.wins = 0;

    MAUVEY.losses = 0;

    MAUVEY.profit = 0;

    MAUVEY.tradeHistory = [];

    updateBatchDisplay();

    hideEntry();

    setPhase("ANALYZING...");

    log("Starting market scan.");

    /*
        YOUR EXISTING DERIV MARKET LIST
        SHOULD BE PROVIDED HERE.
    */

    MAUVEY.markets =
        await getMarkets();

    if (!MAUVEY.running) {
        return;
    }

    MAUVEY.marketIndex = 0;

    scanNextMarket();

}


/*
==========================================================
                 SCAN MARKETS
==========================================================
*/

async function scanNextMarket() {

    if (!MAUVEY.running) {
        return;
    }

    /*
        ALL MARKETS EXHAUSTED

        No valid entry was found.
        Refresh and start again.
    */

    if (
        MAUVEY.marketIndex >=
        MAUVEY.markets.length
    ) {

        log("All markets checked.");

        setPhase("REFRESHING MARKETS...");

        await delay(500);

        if (!MAUVEY.running) {
            return;
        }

        beginAnalysis();

        return;
    }


    const market =
        MAUVEY.markets[
            MAUVEY.marketIndex
        ];

    MAUVEY.marketIndex++;

    showMarket(market);

    resetChecks();

    setPhase("CHECKING MARKET...");

    log(
        `Checking ${market.name} (${market.symbol})`
    );


    /*
        GET THE DATA NEEDED FOR THIS MARKET.

        CONNECT THIS TO YOUR EXISTING
        DERIV TICK/HISTORICAL DATA FUNCTION.
    */

    const data =
        await getMarketData(market);

    if (!MAUVEY.running) {
        return;
    }


    /*
        CHECK EVEN
    */

    setPhase("CHECKING EVEN...");

    const even =
        checkEven(data);

    setCheck(
        "evenCheck",
        even ? "MATCH" : "NO MATCH",
        even ? "good" : "bad"
    );

    if (even) {

        const entry =
            createEntry(
                market,
                "EVEN"
            );

        showEntry(entry);

        log(
            `GOOD ENTRY FOUND: EVEN`
        );

        startBatch(entry);

        return;
    }


    /*
        CHECK ODD
    */

    setPhase("CHECKING ODD...");

    const odd =
        checkOdd(data);

    setCheck(
        "oddCheck",
        odd ? "MATCH" : "NO MATCH",
        odd ? "good" : "bad"
    );

    if (odd) {

        const entry =
            createEntry(
                market,
                "ODD"
            );

        showEntry(entry);

        log(
            `GOOD ENTRY FOUND: ODD`
        );

        startBatch(entry);

        return;
    }


    /*
        CHECK OVER
    */

    setPhase("CHECKING OVER...");

    const over =
        checkOver(data);

    setCheck(
        "overCheck",
        over ? "MATCH" : "NO MATCH",
        over ? "good" : "bad"
    );

    if (over) {

        const entry =
            createEntry(
                market,
                "OVER"
            );

        showEntry(entry);

        log(
            `GOOD ENTRY FOUND: OVER`
        );

        startBatch(entry);

        return;
    }


    /*
        CHECK UNDER
    */

    setPhase("CHECKING UNDER...");

    const under =
        checkUnder(data);

    setCheck(
        "underCheck",
        under ? "MATCH" : "NO MATCH",
        under ? "good" : "bad"
    );

    if (under) {

        const entry =
            createEntry(
                market,
                "UNDER"
            );

        showEntry(entry);

        log(
            `GOOD ENTRY FOUND: UNDER`
        );

        startBatch(entry);

        return;
    }


    /*
        NO ENTRY ON THIS MARKET.

        IMMEDIATELY MOVE TO THE NEXT MARKET.
    */

    setPhase("NO ENTRY → NEXT MARKET");

    log(
        `${market.name}: no valid entry.`
    );

    await delay(100);

    scanNextMarket();

}


/*
==========================================================
                    START BATCH
==========================================================
*/

async function startBatch(entry) {

    if (!MAUVEY.running) {
        return;
    }

    MAUVEY.currentTrade = 0;

    MAUVEY.wins = 0;

    MAUVEY.losses = 0;

    MAUVEY.profit = 0;

    MAUVEY.tradeHistory = [];

    updateBatchDisplay();

    log(
        `BATCH STARTED: ${MAUVEY.runsPerBatch} trades.`
    );

    setPhase(
        `BATCH RUNNING — ${MAUVEY.runsPerBatch} TRADES`
    );


    /*
        RUN EXACTLY THE NUMBER OF TRADES
        SELECTED BY THE USER.
    */

    while (
        MAUVEY.running &&
        MAUVEY.currentTrade <
        MAUVEY.runsPerBatch
    ) {

        await executeBatchTrade(entry);

    }


    if (!MAUVEY.running) {
        return;
    }


    /*
        ONLY AFTER ALL TRADES ARE COMPLETE
        CAN ANALYSIS START AGAIN.
    */

    setPhase("BATCH COMPLETE");

    log("Batch complete.");

    await delay(800);

    if (!MAUVEY.running) {
        return;
    }

    log("Starting new analysis.");

    beginAnalysis();

}


/*
==========================================================
                 EXECUTE ONE TRADE
==========================================================
*/

async function executeBatchTrade(entry) {

    const tradeNumber =
        MAUVEY.currentTrade + 1;

    const stake =
        Number(
            document.getElementById(
                "stakeInput"
            ).value
        );


    setPhase(
        `PLACING TRADE ${tradeNumber} / ${MAUVEY.runsPerBatch}`
    );


    log(
        `Trade ${tradeNumber}/${MAUVEY.runsPerBatch} — ${entry.contract}`
    );


    /*
        IMPORTANT:

        CONNECT THIS FUNCTION TO YOUR
        EXISTING DERIV CONTRACT PURCHASE
        FUNCTION.

        IT MUST RETURN THE ACTUAL RESULT:

        {
            won: true/false,
            profit: number
        }
    */

    const result =
        await placeDerivTrade(
            entry,
            stake
        );


    if (!MAUVEY.running) {
        return;
    }


    MAUVEY.currentTrade++;


    const trade = {

        number:
            tradeNumber,

        contract:
            entry.contract,

        market:
            entry.market.name,

        stake:
            stake,

        result:
            result.won
            ? "WON"
            : "LOST",

        profit:
            Number(result.profit)

    };


    if (result.won) {

        MAUVEY.wins++;

        setPhase(
            `TRADE ${tradeNumber}: WON`
        );

        log(
            `Trade ${tradeNumber} WON. Profit: ${result.profit.toFixed(2)}`
        );

    } else {

        MAUVEY.losses++;

        setPhase(
            `TRADE ${tradeNumber}: LOST`
        );

        log(
            `Trade ${tradeNumber} LOST. Profit: ${result.profit.toFixed(2)}`
        );

    }


    MAUVEY.profit +=
        Number(result.profit);


    MAUVEY.tradeHistory.push(
        trade
    );


    addTradeToHistory(
        trade
    );


    updateBatchDisplay();


    /*
        VERY IMPORTANT:

        WE DO NOT CALL beginAnalysis()
        HERE.

        WE DO NOT SCAN ANOTHER MARKET.

        WE DO NOT STOP BECAUSE OF A LOSS.

        WE DO NOT STOP BECAUSE OF A WIN.

        WE SIMPLY CONTINUE THE SAME BATCH.
    */

    await delay(300);

}


/*
==========================================================
                 ENTRY CREATION
==========================================================
*/

function createEntry(
    market,
    contract
) {

    return {

        market:
            market,

        contract:
            contract,

        stake:
            Number(
                document.getElementById(
                    "stakeInput"
                ).value
            )

    };

}


/*
==========================================================
              DERIV INTEGRATION POINTS
==========================================================

THE FUNCTIONS BELOW ARE INTENTIONALLY
SEPARATED FROM THE MAUVEY ENGINE.

CONNECT THEM TO THE DERIV CODE YOU
ALREADY HAVE.

==========================================================
*/


async function getMarkets() {

    /*
        REPLACE THIS WITH YOUR EXISTING
        DERIV MARKET-LOADING FUNCTION.

        IT SHOULD RETURN:

        [
