.input {

.btn {

.balance-label {

}

}

.settings {

.field label {

.field input,

.strategy-main {

}

.strategy-name {

.status {

.status-dot {

  border-radius: 50%;

}

.status-dot.active {
  background: #19a463;

.status-dot.error {

}

.status-text {

.analysis-grid {

}

.stat {

}

.stat-label {
  color: #777;

.stat-value {

}

.trade-market {

}

.trade-contract {

}

.trade-grid {

}

.trade-stat {

.trade-label {

}

.trade-value {

  font-weight: 850;

.history-header {
  display: flex;

.count {

.trade-list {

.trade-row {

.empty {

.hidden {

.footer {

@media(max-width:380px) {
  .settings {
    grid-template-columns: 1fr;
  }

/*
============================================================
MAUVEY — FAST MARKET ENGINE
============================================================

APP ID
*/

const APP_ID =
  "34fv9KSI5Got7lmvR0eqY";


/*
============================================================
API
============================================================
*/

const API_BASE =
  "https://api.derivws.com";

const PUBLIC_WS =
  "wss://api.derivws.com/trading/v1/options/ws/public";


/*
============================================================
ENGINE SETTINGS
============================================================
*/

const ANALYSIS_TICKS =
  1000;

const MARKET_PARALLELISM =
  5;


/*
============================================================
STATE
============================================================
*/

const state = {

  pat: "",

  connected: false,

  running: false,

  accounts: [],

  selectedAccount: null,

  publicWS: null,

  authenticatedWS: null,

  activeSymbols: [],

  volatilitySymbols: [],

  balance: 0,

  currency: "",

  duration: 1,

  batchSize: 10,

  baseStake: 1,

  currentStake: 1,

  martingale: 2,

  batchPosition: 0,

  trades: [],

  totalTrades: 0,

  currentOpportunity: null

};


/*
============================================================
ELEMENTS
============================================================
*/

const $ = id =>
  document.getElementById(id);

const pat =
  $("pat");

const connect =
  $("connect");

const accountCard =
  $("accountCard");

const accounts =
  $("accounts");

const start =
  $("start");

const balance =
  $("balance");

const currency =
  $("currency");

const connectionDot =
  $("connectionDot");

const connectionText =
  $("connectionText");

const statusDot =
  $("statusDot");

const status =
  $("status");

const statusDetail =
  $("statusDetail");

const analysis =
  $("analysis");

const analysisDetail =
  $("analysisDetail");

const markets =
  $("markets");

const selectedMarket =
  $("selectedMarket");

const selectedContract =
  $("selectedContract");

const strategyStatus =
  $("strategyStatus");

const currentCard =
  $("currentCard");

const tradeMarket =
  $("tradeMarket");

const tradeContract =
  $("tradeContract");

const tradeBatch =
  $("tradeBatch");

const tradeStake =
  $("tradeStake");

const tradeResult =
  $("tradeResult");

const tradeList =
  $("tradeList");

const tradeCount =
  $("tradeCount");


/*
============================================================
UI HELPERS
============================================================
*/

function setStatus(
  message,
  detail = "",
  active = false,
  error = false
) {

  status.textContent =
    message;

  statusDetail.textContent =
    detail;

  statusDot.classList.remove(
    "active",
    "error"
  );

  if (error) {

    statusDot.classList.add(
      "error"
    );

  } else if (active) {

    statusDot.classList.add(
      "active"
    );

  }

}


function setConnection(
  connected,
  text
) {

  state.connected =
    connected;

  connectionDot.classList.remove(
    "connected",
    "error"
  );

  if (connected) {

    connectionDot.classList.add(
      "connected"
    );

  }

  connectionText.textContent =
    text;

}


function setConnectionError(
  message
) {

  connectionDot.classList.remove(
    "connected"
  );

  connectionDot.classList.add(
    "error"
  );

  connectionText.textContent =
    "Connection error";

  setStatus(
    message,
    "",
    false,
    true
  );

}


function updateBalance(
  amount,
  curr
) {

  state.balance =
    Number(amount) || 0;

  if (curr) {

    state.currency =
      curr;

  }

  balance.textContent =
    state.balance.toFixed(2);

  currency.textContent =
    state.currency || "—";

}


/*
============================================================
ACCOUNT CONNECTION
============================================================
*/

connect.addEventListener(
  "click",
  connectAccount
);


async function connectAccount() {

  const token =
    pat.value.trim();

  if (!token) {

    setStatus(
      "PAT required.",
      "Enter your Deriv PAT.",
      false,
      true
    );

    return;

  }


  connect.disabled =
    true;


  setStatus(
    "Connecting...",
    "Authenticating your Deriv account.",
    true
  );


  try {

    state.pat =
      token;


    /*
     * Current authenticated account discovery.
     */

    const response =
      await fetch(
        `${API_BASE}/trading/v1/options/accounts`,
        {

          method: "GET",

          headers: {

            "Authorization":
              `Bearer ${token}`,

            "Deriv-App-ID":
              APP_ID,

            "Accept":
              "application/json"

          }

        }
      );


    if (!response.ok) {

      const body =
        await response.text();

      throw new Error(
        `Deriv returned ${response.status}. ${body}`
      );

    }


    const json =
      await response.json();


    state.accounts =
      normalizeAccounts(
        json
      );


    if (
      !state.accounts.length
    ) {

      throw new Error(
        "The PAT returned no accounts."
      );

    }


    renderAccounts();


    accountCard.classList.remove(
      "hidden"
    );


    /*
     * Prefer DEMO, but display REAL as well
     * whenever the PAT has access to it.
     */

    const demo =
      state.accounts.find(
        a =>
          a.type === "demo"
      );


    selectAccount(
      demo ||
      state.accounts[0]
    );


    setConnection(
      true,
      "Accounts loaded"
    );


    setStatus(
      "Choose your account.",
      `${state.accounts.length} account(s) available.`,
      false
    );


    /*
     * Public market data starts immediately.
     * It does NOT wait for the account WebSocket.
     */

    connectPublicMarketData()
      .catch(
        error =>
          console.error(
            "Market data:",
            error
          )
      );


  } catch (error) {

    console.error(
      error
    );


    setConnectionError(
      error.message ||
      "Could not connect."
    );

  } finally {

    connect.disabled =
      false;

  }

}


/*
============================================================
ACCOUNT NORMALIZATION
============================================================
*/

function normalizeAccounts(
  response
) {

  const possible =
    response?.data ||
    response?.accounts ||
    response;


  if (
    !Array.isArray(
      possible
    )
  ) {

    return [];

  }


  return possible
    .map(
      item => {

        const id =
          item.account_id ||
          item.accountId ||
          item.id;


        if (!id) {

          return null;

        }


        const rawType =
          String(
            item.account_type ||
            item.type ||
            ""
          ).toLowerCase();


        return {

          accountId:
            String(id),

          type:
            rawType.includes(
              "demo"
            )
              ? "demo"
              : "real",

          currency:
            item.currency ||
            item.currency_code ||
            ""

        };

      }
    )
    .filter(Boolean);

}


/*
============================================================
ACCOUNT UI
============================================================
*/

function renderAccounts() {

  accounts.innerHTML =
    "";


  state.accounts.forEach(
    account => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "account";


      if (
        state.selectedAccount &&
        state.selectedAccount.accountId ===
        account.accountId
      ) {

        button.classList.add(
          "active"
        );

      }


      button.innerHTML = `
        <div class="account-type">
          ${account.type.toUpperCase()}
        </div>

        <div class="account-id">
          ${escapeHTML(account.accountId)}
        </div>
      `;


      button.onclick =
        () =>
          selectAccount(
            account
          );


      accounts.appendChild(
        button
      );

    }
  );

}


function selectAccount(
  account
) {

  state.selectedAccount =
    account;


  renderAccounts();


  /*
   * Open the authenticated account
   * only after the user chooses Demo/Real.
   */

  openAccountWebSocket()
    .then(
      () => {

        start.disabled =
          false;

      }
    )
    .catch(
      error => {

        console.error(
          error
        );

        setConnectionError(
          error.message ||
          "Could not authorize selected account."
        );

      }
    );

}


/*
============================================================
AUTHENTICATED WEBSOCKET
============================================================
*/

async function openAccountWebSocket() {

  if (
    !state.selectedAccount
  ) {

    throw new Error(
      "Select an account."
    );

  }


  setStatus(
    "Authorizing account...",
    `Connecting to ${state.selectedAccount.type.toUpperCase()} account.`,
    true
  );


  const response =
    await fetch(
      `${API_BASE}/trading/v1/options/accounts/${encodeURIComponent(
        state.selectedAccount.accountId
      )}/otp`,
      {

        method: "POST",

        headers: {

          "Authorization":
            `Bearer ${state.pat}`,

          "Deriv-App-ID":
            APP_ID,

          "Accept":
            "application/json"

        }

      }
    );


  if (!response.ok) {

    const body =
      await response.text();

    throw new Error(
      `Account authorization failed (${response.status}). ${body}`
    );

  }


  const json =
    await response.json();


  const url =
    json?.data?.url ||
    json?.url;


  if (!url) {

    throw new Error(
      "Deriv did not return an account WebSocket URL."
    );

  }


  await createAuthenticatedSocket(
    url
  );

}


function createAuthenticatedSocket(
  url
) {

  return new Promise(
    (resolve, reject) => {

      const ws =
        new WebSocket(
          url
        );


      state.authenticatedWS =
        ws;


      let opened =
        false;


      ws.onopen =
        () => {

          opened =
            true;


          /*
           * Real balance subscription.
           */

          ws.send(
            JSON.stringify({

              balance: 1,

              subscribe: 1,

              req_id: 501

            })
          );


          setConnection(
            true,
            state.selectedAccount.type ===
            "demo"
              ? "Demo connected"
              : "Real connected"
          );


          setStatus(
            "Account connected.",
            "Live balance connection established.",
            true
          );


          resolve();

        };


      ws.onmessage =
        event => {

          let data;

          try {

            data =
              JSON.parse(
                event.data
              );

          } catch {

            return;

          }


          handleAccountMessage(
            data
          );

        };


      ws.onerror =
        () => {

          if (!opened) {

            reject(
              new Error(
                "Account WebSocket failed."
              )
            );

          }

        };


      ws.onclose =
        () => {

          state.authenticatedWS =
            null;


          if (
            state.running
          ) {

            stopMauvey();

          }


          start.disabled =
            true;


          setConnection(
            false,
            "Disconnected"
          );

        };

    }
  );

}


function handleAccountMessage(
  data
) {

  if (
    data.error
  ) {

    console.error(
      data.error
    );

    setConnectionError(
      data.error.message ||
      "Deriv account error."
    );

    return;

  }


  if (
    data.msg_type ===
    "balance"
  ) {

    const item =
      data.balance || {};


    updateBalance(
      item.balance ??
      item.amount ??
      0,

      item.currency ??
      state.selectedAccount?.currency
    );


    setStatus(
      "Connected.",
      "Live account balance is active.",
      false
    );


    return;

  }


  if (
    data.msg_type ===
    "buy"
  ) {

    handleBuy(
      data
    );

    return;

  }


  if (
    data.msg_type ===
    "proposal"
  ) {

    handleProposal(
      data
    );

    return;

  }


  if (
    data.msg_type ===
    "proposal_open_contract"
  ) {

    handleOpenContract(
      data
    );

  }

}

function handlePublicMessage(
  data
) {

  if (
    data.error
  ) {

    console.error(
      data.error
    );

    return;

  }


  if (
    data.msg_type !==
    "active_symbols"
  ) {

    return;

  }


  state.activeSymbols =
    data.active_symbols ||
    [];


  /*
   * Automatic Volatility selection.
   *
   * No market selector exists in the UI.
   */

  state.volatilitySymbols =
    state.activeSymbols.filter(
      item => {

        const name =
          String(
            item.underlying_symbol_name ||
            item.display_name ||
            ""
          ).toLowerCase();


        const code =
          String(
            item.underlying_symbol ||
            item.symbol ||
            ""
          ).toUpperCase();


        return (
          name.includes(
            "volatility"
          ) ||
          code.includes(
            "1HZ"
          ) ||
          code.startsWith(
            "R_"
          )
        );

      }
    );


  markets.textContent =
    state.volatilitySymbols.length;


  analysisDetail.textContent =
    `${state.volatilitySymbols.length} Volatility markets ready. Mauvey checks 5 at a time.`;

}


/*
============================================================
FAST PARALLEL SCANNER
============================================================
*/

async function analyzeAllMarkets() {

  const symbols =
    [...state.volatilitySymbols];


  if (
    !symbols.length
  ) {

    return null;

  }


  /*
   * Shuffle the scan order so Mauvey doesn't permanently
   * favor the first symbols returned by the API.
   */

  shuffle(
    symbols
  );


  let best =
    null;


  for (
    let i = 0;
    i < symbols.length;
    i += MARKET_PARALLELISM
  ) {

    if (
      !state.running
    ) {

      return null;

    }


    const group =
      symbols.slice(
        i,
        i +
        MARKET_PARALLELISM
      );


    analysis.textContent =
      `Analyzing ${group.length} markets...`;


    /*
     * THIS IS THE IMPORTANT SPEED FIX.
     *
     * All five tick-history requests happen at the same time.
     */

    const results =
      await Promise.allSettled(
        group.map(
          async symbol => {

            const code =
              symbol.underlying_symbol ||
              symbol.symbol;


            const prices =
              await getHistory(
                code,
                ANALYSIS_TICKS
              );


            const stats =
              analyzeDigits(
                prices
              );


            const opportunity =
              evaluateStrategy(
                symbol,
                stats
              );


            return {

              symbol,

              prices,

              stats,

              opportunity

            };

          }
        )
      );


    for (
      const result of results
    ) {

      if (
        result.status !==
        "fulfilled"
      ) {

        continue;

      }


      const opportunity =
        result.value.opportunity;


      if (
        !opportunity
      ) {

        continue;

      }


      if (
        !best ||
        opportunity.score >
        best.score
      ) {

        best =
          opportunity;

      }

    }


    if (
      best
    ) {

      break;

    }

  }


  return best;

}


/*
============================================================
HISTORICAL DATA
============================================================
*/

function getHistory(
  symbol,
  count
) {

  return new Promise(
    (resolve, reject) => {

      if (
        !state.publicWS ||
        state.publicWS.readyState !==
        WebSocket.OPEN
      ) {

        reject(
          new Error(
            "Market connection unavailable."
          )
        );

        return;

      }


      const reqId =
        Date.now() +
        Math.floor(
          Math.random() *
          10000
        );


      const listener =
        event => {

          let data;

          try {

            data =
              JSON.parse(
                event.data
              );

          } catch {

            return;

          }


          if (
            data.req_id !==
            reqId
          ) {

            return;

          }


          state.publicWS.removeEventListener(
            "message",
            listener
          );


          if (
            data.error
          ) {

            reject(
              new Error(
                data.error.message
              )
            );

            return;

          }


          resolve(
            data.history?.prices ||
            []
          );

        };


      state.publicWS.addEventListener(
        "message",
        listener
      );


      state.publicWS.send(
        JSON.stringify({

          ticks_history:
            symbol,

          count:
            count,

          end:
            "latest",

          style:
            "ticks",

          req_id:
            reqId

        })
      );

    }
  );

}


/*
============================================================
DIGIT ANALYSIS
============================================================
*/

function finalDigit(
  value
) {

  const text =
    String(
      value
    );


  const digits =
    text.replace(
      /\D/g,
      ""
    );


  if (
    !digits
  ) {

    return null;

  }


  return Number(
    digits[
      digits.length - 1
    ]
  );

}


function analyzeDigits(
  prices
) {

  const counts =
    Array(10).fill(0);


  for (
    const price of prices
  ) {

    const digit =
      finalDigit(
        price
      );


    if (
      digit === null
    ) {

      continue;

    }


    counts[digit]++;

  }


  const total =
    counts.reduce(
      (a,b) =>
        a + b,
      0
    );


  const percentages =
    counts.map(
      count =>
        total
          ? count / total * 100
          : 0
    );


  const ranked =
    percentages
      .map(
        (percentage,digit) => ({
          digit,
          percentage,
          count:
            counts[digit]
        })
      )
      .sort(
        (a,b) =>
          b.percentage -
          a.percentage
      );


  const even =
    counts[0] +
    counts[2] +
    counts[4] +
    counts[6] +
    counts[8];


  const odd =
    counts[1] +
    counts[3] +
    counts[5] +
    counts[7] +
    counts[9];


  return {

    counts,

    percentages,

    ranked,

    evenPercentage:
      total
        ? even / total * 100
        : 0,

    oddPercentage:
      total
        ? odd / total * 100
        : 0,

    total

  };

}


/*
============================================================
STRATEGY
============================================================
*/

function evaluateStrategy(
  symbol,
  stats
) {

  if (
    stats.total <
    ANALYSIS_TICKS * .8
  ) {

    return null;

  }


  const first =
    stats.ranked[0];


  const second =
    stats.ranked[1];


  if (
    !first ||
    !second
  ) {

    return null;

  }


  const market =
    symbol.underlying_symbol_name ||
    symbol.display_name ||
    symbol.underlying_symbol ||
    symbol.symbol;


  /*
   * EVEN
   */

  if (
    first.digit % 2 === 0 &&
    second.digit % 2 === 0 &&
    stats.evenPercentage >= 51
  ) {

    return {

      market,

      symbol:
        symbol.underlying_symbol ||
        symbol.symbol,

      contract:
        "EVEN",

      score:
        stats.evenPercentage,

      reason:
        `Strongest digits ${first.digit} and ${second.digit} are even. EVEN ${stats.evenPercentage.toFixed(1)}%.`

    };

  }


  /*
   * ODD
   */

  if (
    first.digit % 2 === 1 &&
    second.digit % 2 === 1 &&
    stats.oddPercentage >= 51
  ) {

    return {

      market,

      symbol:
        symbol.underlying_symbol ||
        symbol.symbol,

      contract:
        "ODD",

      score:
        stats.oddPercentage,

      reason:
        `Strongest digits ${first.digit} and ${second.digit} are odd. ODD ${stats.oddPercentage.toFixed(1)}%.`

    };

  }


  /*
   * OVER 3
   */

  const over =
    [4,5,6,7,8,9]
      .reduce(
        (
          total,
          digit
        ) =>
          total +
          stats.percentages[digit],
        0
      );


  if (
    over >= 51 &&
    [4,5,6,7,8,9].includes(
      first.digit
    )
  ) {

    return {

      market,

      symbol:
        symbol.underlying_symbol ||
        symbol.symbol,

      contract:
        "OVER 3",

      score:
        over,

      reason:
        `Digits 4–9 represent ${over.toFixed(1)}% of the sample.`

    };

  }


  /*
   * UNDER 7
   */

  const under =
    [0,1,2,3,4,5,6]
      .reduce(
        (
          total,
          digit
        ) =>
          total +
          stats.percentages[digit],
        0
      );


  if (
    under >= 51 &&
    [0,1,2,3,4,5,6].includes(
      first.digit
    )
  ) {

    return {

      market,

      symbol:
        symbol.underlying_symbol ||
        symbol.symbol,

      contract:
        "UNDER 7",

      score:
        under,

      reason:
        `Digits 0–6 represent ${under.toFixed(1)}% of the sample.`

    };

  }


  return null;

}

/*
============================================================
SCAN LOOP
============================================================
*/

async function scanLoop() {

  while (
    state.running
  ) {

    try {

      analysis.textContent =
        "Scanning Volatility markets...";


      analysisDetail.textContent =
        "Checking 5 markets concurrently using the latest 1,000 ticks.";


      strategyStatus.textContent =
        "Analyzing";


      setStatus(
        "Analyzing markets...",
        "Mauvey is checking multiple markets simultaneously.",
        true
      );


      const opportunity =
        await analyzeAllMarkets();


      if (
        !state.running
      ) {

        break;

      }


      if (
        !opportunity
      ) {

        analysis.textContent =
          "No qualifying setup yet.";

        strategyStatus.textContent =
          "Waiting";


        setStatus(
          "Waiting for a valid setup...",
          "Mauvey will continue scanning automatically.",
          true
        );


        await sleep(
          700
        );


        continue;

      }


      state.currentOpportunity =
        opportunity;


      selectedMarket.textContent =
        opportunity.market;


      selectedContract.textContent =
        opportunity.contract;


      analysis.textContent =
        "Valid setup found.";


      analysisDetail.textContent =
        opportunity.reason;


      strategyStatus.textContent =
        "Entry setup";


      setStatus(
        `${opportunity.market} selected.`,
        "Waiting for the live entry pattern.",
        true
      );


      /*
       * Do NOT analyze again here.
       *
       * The selected market is now watched for the
       * live entry condition.
       */

      const entry =
        await waitForEntry(
          opportunity
        );


      if (
        !state.running
      ) {

        break;

      }


      if (
        entry
      ) {

        await executeBatch(
          opportunity
        );

      }

    } catch (
      error
    ) {

      console.error(
        error
      );


      if (
        !state.running
      ) {

        break;

      }


      setStatus(
        "Scanner error.",
        error.message ||
        "Retrying...",
        false,
        true
      );


      await sleep(
        1500
      );

    }

  }

}


/*
============================================================
LIVE ENTRY
============================================================
*/

async function waitForEntry(
  opportunity
) {

  /*
   * Live entry detection belongs on the tick stream.
   *
   * We subscribe to the selected market instead of repeatedly
   * requesting 1,000 ticks.
   */

  if (
    !state.publicWS ||
    state.publicWS.readyState !==
    WebSocket.OPEN
  ) {

    throw new Error(
      "Market WebSocket is unavailable."
    );

  }


  const symbol =
    opportunity.symbol;


  const requestId =
    Date.now();


  return new Promise(
    resolve => {

      let previous = [];

      const listener =
        event => {

          let data;

          try {

            data =
              JSON.parse(
                event.data
              );

          } catch {

            return;

          }


          if (
            data.error
          ) {

            return;

          }


          if (
            data.msg_type !==
            "tick"
          ) {

            return;

          }


          if (
            data.tick?.symbol !==
            symbol
          ) {

            return;

          }


          const digit =
            finalDigit(
              data.tick.quote
            );


          if (
            digit === null
          ) {

            return;

          }


          previous.push(
            digit
          );


          if (
            previous.length >
            4
          ) {

            previous =
              previous.slice(
                -4
              );

          }


          /*
           * EVEN:
           *
           * ODD ODD ODD EVEN
           */

          if (
            opportunity.contract ===
            "EVEN"
          ) {

            if (
              previous.length === 4 &&
              previous[0] % 2 === 1 &&
              previous[1] % 2 === 1 &&
              previous[2] % 2 === 1 &&
              previous[3] % 2 === 0
            ) {

              cleanup();


              resolve({
                digit
              });

            }

          }


          /*
           * ODD:
           *
           * EVEN EVEN EVEN ODD
           */

          if (
            opportunity.contract ===
            "ODD"
          ) {

            if (
              previous.length === 4 &&
              previous[0] % 2 === 0 &&
              previous[1] % 2 === 0 &&
              previous[2] % 2 === 0 &&
              previous[3] % 2 === 1
            ) {

              cleanup();


              resolve({
                digit
              });

            }

          }

        };


      function cleanup() {

        state.publicWS.removeEventListener(
          "message",
          listener
        );


        state.publicWS.send(
          JSON.stringify({

            forget:
              requestId,

            req_id:
              requestId + 1

          })
        );

      }


      state.publicWS.addEventListener(
        "message",
        listener
      );


      state.publicWS.send(
        JSON.stringify({

          ticks:
            symbol,

          subscribe:
            1,

          req_id:
            requestId

        })
      );


      setStatus(
        `Watching ${opportunity.market}`,
        "Waiting for the live entry pattern.",
        true
      );

    }
  );

}


/*
============================================================
BATCH
============================================================
*/

async function executeBatch(
  opportunity
) {

  state.currentStake =
    state.baseStake;


  for (
    let i = 1;
    i <= state.batchSize;
    i++
  ) {

    if (
      !state.running
    ) {

      return;

    }


    state.batchPosition =
      i;


    updateCurrentTrade(
      opportunity,
      "WAITING"
    );


    setStatus(
      `Trade ${i} of ${state.batchSize}`,
      `${opportunity.contract} on ${opportunity.market}`,
      true
    );


    /*
     * The same market/setup is used throughout the batch.
     */

    const result =
      await placeRealTrade(
        opportunity
      );


    if (
      !state.running
    ) {

      return;

    }


    addTrade(
      result
    );


    /*
     * 2× after loss.
     */

    if (
      result.result ===
      "LOSS"
    ) {

      state.currentStake *=
        state.martingale;

    }


    /*
     * Reset after win.
     */

    if (
      result.result ===
      "WIN"
    ) {

      state.currentStake =
        state.baseStake;

    }


    await sleep(
      100
    );

  }


  /*
   * Only after the whole batch:
   *
   * analyze again.
   */

  state.currentOpportunity =
    null;

}


/*
============================================================
REAL TRADE ENGINE
============================================================
*/

async function placeRealTrade(
  opportunity
) {

  /*
   * No fake/random trade is allowed.
   *
   * This must send the exact Deriv proposal contract for
   * the selected contract type and then buy it.
   */

  if (
    !state.authenticatedWS ||
    state.authenticatedWS.readyState !==
    WebSocket.OPEN
  ) {

    throw new Error(
      "Authenticated trading connection is closed."
    );

  }


  /*
   * The final proposal parameters are intentionally isolated
   * here. This prevents the analyzer from ever pretending that
   * a trade was placed.
   *
   * We will map the four requested contracts to Deriv's exact
   * current proposal schema in the trading layer.
   */


  throw new Error(
    "Trading proposal mapping is not enabled in this GitHub-only build."
  );

}

/*
============================================================
TRADE HISTORY
============================================================
*/

function addTrade(
  result
) {

  state.totalTrades++;


  state.trades.unshift({

    number:
      state.totalTrades,

    market:
      result.market,

    contract:
      result.contract,

    stake:
      result.stake,

    result:
      result.result,

    profit:
      result.profit

  });


  if (
    state.trades.length >
    100
  ) {

    state.trades.pop();

  }


  renderTrades();

}


function renderTrades() {

  tradeList.innerHTML =
    "";


  tradeCount.textContent =
    `${state.trades.length} trades`;


  if (
    !state.trades.length
  ) {

    tradeList.innerHTML =
      `<div class="empty">No trades yet.</div>`;

    return;

  }


  state.trades.forEach(
    item => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "trade-row";


      const resultClass =
        item.result ===
        "WIN"
          ? "win"
          : item.result ===
            "LOSS"
              ? "loss"
              : "pending";


      row.innerHTML = `

        <div class="trade-number">
          #${item.number}
        </div>

        <div class="trade-name">
          ${escapeHTML(item.market)}
          ·
          ${escapeHTML(item.contract)}
        </div>

        <div class="${resultClass}">
          ${escapeHTML(item.result)}
        </div>

        <div class="${Number(item.profit) >= 0 ? "win" : "loss"}">
          ${Number(item.profit || 0) >= 0 ? "+" : ""}
          ${Number(item.profit || 0).toFixed(2)}
        </div>

      `;


      tradeList.appendChild(
        row
      );

    }
  );

}


/*

============================================================
*/

function readSettings() {

  state.duration =
    Math.max(
      1,
      Math.min(
        100,
        Number(
          $("duration").value
        ) || 1
      )
    );


  state.batchSize =
    Math.max(
      1,
      Math.min(
        100,
        Number(
          $("batch").value
        ) || 10
      )
    );


  state.baseStake =
    Math.max(
      .01,
      Number(
        $("stake").value
      ) || 1
    );


  state.martingale =
    Number(
      $("martingale").value
    ) || 2;

}

function sleep(
  milliseconds
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        milliseconds
      )
  );

}


function shuffle(
  array
) {

  for (
    let i =
      array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}


function escapeHTML(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
