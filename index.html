/* =========================================================
   MAUVEY
   MARKET ANALYZER
   ========================================================= */


/* ---------------------------------------------------------
   APP ID
--------------------------------------------------------- */

const APP_ID =
    "34fv9KSI5Got7lmvR0eqY";


/* ---------------------------------------------------------
   PUBLIC MARKET WEBSOCKET
--------------------------------------------------------- */

const PUBLIC_URL =
    "wss://ws.derivws.com/websockets/v3";


/* ---------------------------------------------------------
   CONFIG
--------------------------------------------------------- */

const HISTORY_COUNT =
    1000;

const PARALLEL_MARKETS =
    5;


/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */

const state = {

    pat: "",

    publicWS: null,

    accountWS: null,

    connected: false,

    running: false,

    accounts: [],

    selectedAccount: null,

    symbols: [],

    volatilityMarkets: [],

    currentMarketIndex: 0,

    currentOpportunity: null,

    duration: 1,

    batch: 10,

    baseStake: 1,

    martingale: 2,

    currentStake: 1,

    batchPosition: 0,

    trades: []

};


/* ---------------------------------------------------------
   ELEMENTS
--------------------------------------------------------- */

const el = id =>
    document.getElementById(id);


/* ---------------------------------------------------------
   BASIC UI
--------------------------------------------------------- */

function setStatus(
    text,
    detail = "",
    active = false,
    error = false
) {

    el("status").textContent =
        text;

    el("detail").textContent =
        detail;

    el("statusDot").className =
        "dot" +
        (
            active
                ? " green"
                : error
                    ? " red"
                    : ""
        );

}


function setConnection(
    text,
    connected = false
) {

    el("connectionText").textContent =
        text;

    el("connectionDot").className =
        connected
            ? "dot green"
            : "dot";

}


/* ---------------------------------------------------------
   CONNECT
--------------------------------------------------------- */

el("connectBtn").onclick =
    connectDeriv;


async function connectDeriv() {

    const pat =
        el("pat").value.trim();


    if (!pat) {

        setStatus(
            "PAT required.",
            "Enter your Deriv PAT.",
            false,
            true
        );

        return;

    }


    state.pat =
        pat;


    el("connectBtn").disabled =
        true;


    setStatus(
        "Connecting...",
        "Opening Deriv connection.",
        true
    );


    try {

        await connectPublic();


        /*
         * Public connection is enough to immediately
         * begin market discovery.
         */

        setStatus(
            "Loading markets...",
            "Getting the complete active market list.",
            true
        );


        await requestActiveSymbols();


        /*
         * Account authentication is separate.
         *
         * We attempt it without blocking market scanning.
         */

        loadAccounts()
            .catch(
                error => {

                    console.error(
                        "Account:",
                        error
                    );

                    setStatus(
                        "Markets connected.",
                        "Account authentication still needs attention.",
                        false,
                        true
                    );

                }
            );


        setConnection(
            "Market connected",
            true
        );


    } catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(
            "Connection failed.",
            error.message,
            false,
            true
        );


    } finally {

        el("connectBtn").disabled =
            false;

    }

}


/* ---------------------------------------------------------
   PUBLIC WEBSOCKET
--------------------------------------------------------- */

function connectPublic() {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            if (
                state.publicWS &&
                state.publicWS.readyState ===
                WebSocket.OPEN
            ) {

                resolve();

                return;

            }


            const ws =
                new WebSocket(
                    PUBLIC_URL
                );


            state.publicWS =
                ws;


            ws.onopen =
                () => {

                    resolve();

                };


            ws.onerror =
                () => {

                    reject(
                        new Error(
                            "Deriv public market connection failed."
                        )
                    );

                };


            ws.onclose =
                () => {

                    if (
                        state.running
                    ) {

                        stopMauvey();

                    }

                    setConnection(
                        "Disconnected",
                        false
                    );

                };


            ws.onmessage =
                event => {

                    let data;

                    try {

                        data =
                            JSON.parse(
                                event.data
                            );

                    } catch {

                        return;

                    }


                    handlePublicMessage(
                        data
                    );

                };

        }
    );

}


/* ---------------------------------------------------------
   ACTIVE SYMBOLS
--------------------------------------------------------- */

function requestActiveSymbols() {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const requestId =
                Date.now();


            const listener =
                event => {

                    let data;

                    try {

                        data =
                            JSON.parse(
                                event.data
                            );

                    } catch {

                        return;

                    }


                    if (
                        data.req_id !==
                        requestId
                    ) {

                        return;

                    }


                    state.publicWS.removeEventListener(
                        "message",
                        listener
                    );


                    if (
                        data.error
                    ) {

                        reject(
                            new Error(
                                data.error.message
                            )
                        );

                        return;

                    }


                    const symbols =
                        data.active_symbols ||
                        [];


                    state.symbols =
                        symbols;


                    /*
                     * IMPORTANT:
                     *
                     * We DO NOT filter out 1-second
                     * Volatility markets.
                     *
                     * All currently available Volatility
                     * markets are eligible.
                     */

                    state.volatilityMarkets =
                        symbols.filter(
                            item => {

                                const name =
                                    String(
                                        item.underlying_symbol_name ||
                                        ""
                                    ).toLowerCase();


                                const code =
                                    String(
                                        item.underlying_symbol ||
                                        ""
                                    ).toUpperCase();


                                return (
                                    name.includes(
                                        "volatility"
                                    ) ||
                                    code.includes(
                                        "VOLATILITY"
                                    ) ||
                                    code.startsWith(
                                        "1HZ"
                                    )
                                );

                            }
                        );


                    el("scanCounter").textContent =
                        `${state.volatilityMarkets.length} markets`;


                    el("scannerMessage").textContent =
                        `All available Volatility markets loaded. 1-second markets are included.`;


                    resolve();

                };


            state.publicWS.addEventListener(
                "message",
                listener
            );


            state.publicWS.send(
                JSON.stringify({

                    active_symbols:
                        "brief",

                    req_id:
                        requestId

                })
            );

        }
    );

}


/* ---------------------------------------------------------
   PUBLIC MESSAGE
--------------------------------------------------------- */

function handlePublicMessage(
    data
) {

    if (
        data.msg_type ===
        "active_symbols"
    ) {

        /*
         * handled by requestActiveSymbols()
         */

        return;

    }

}


/* ---------------------------------------------------------
   ACCOUNT LOADING
--------------------------------------------------------- */

async function loadAccounts() {

    /*
     * Current Deriv authenticated setup uses a REST
     * authorization flow to obtain an account session.
     *
     * We keep this isolated from public market scanning
     * so a slow account response cannot slow the analyzer.
     */

    const response =
        await fetch(
            "https://api.derivws.com/trading/v1/options/accounts",
            {

                method: "GET",

                headers: {

                    "Authorization":
                        `Bearer ${state.pat}`,

                    "Deriv-App-ID":
                        APP_ID,

                    "Accept":
                        "application/json"

                }

            }
        );


    if (
        !response.ok
    ) {

        throw new Error(
            `Account request returned HTTP ${response.status}.`
        );

    }


    const json =
        await response.json();


    const raw =
        json.accounts ||
        json.data ||
        [];


    if (
        !Array.isArray(
            raw
        )
    ) {

        throw new Error(
            "No account list was returned."
        );

    }


    state.accounts =
        raw
            .map(
                account => {

                    const id =
                        account.account_id ||
                        account.accountId ||
                        account.id;


                    if (
                        !id
                    ) {

                        return null;

                    }


                    const type =
                        String(
                            account.account_type ||
                            account.type ||
                            ""
                        ).toLowerCase();


                    return {

                        id:
                            String(id),

                        type:
                            type.includes(
                                "demo"
                            )
                                ? "demo"
                                : "real",

                        currency:
                            account.currency ||
                            ""

                    };

                }
            )
            .filter(Boolean);


    renderAccounts();


    if (
        state.accounts.length
    ) {

        el("accountsCard")
            .classList
            .remove(
                "hidden"
            );


        const demo =
            state.accounts.find(
                a =>
                    a.type === "demo"
            );


        selectAccount(
            demo ||
            state.accounts[0]
        );

    }

}


/* ---------------------------------------------------------
   ACCOUNT UI
--------------------------------------------------------- */

function renderAccounts() {

    const container =
        el("accounts");


    container.innerHTML =
        "";


    state.accounts.forEach(
        account => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "account";


            if (
                state.selectedAccount &&
                state.selectedAccount.id ===
                account.id
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.innerHTML = `

                <div class="account-type">
                    ${account.type.toUpperCase()}
                </div>

                <div class="account-id">
                    ${escapeHTML(account.id)}
                </div>

            `;


            button.onclick =
                () =>
                    selectAccount(
                        account
                    );


            container.appendChild(
                button
            );

        }
    );

}


/* ---------------------------------------------------------
   SELECT ACCOUNT
--------------------------------------------------------- */

async function selectAccount(
    account
) {

    state.selectedAccount =
        account;


    renderAccounts();


    try {

        await authenticateAccount(
            account
        );


        el("startBtn").disabled =
            false;


        setStatus(
            `${account.type.toUpperCase()} account connected.`,
            "Live account connection established.",
            true
        );


    } catch (
        error
    ) {

        console.error(
            error
        );


        setStatus(
            "Account connection failed.",
            error.message,
            false,
            true
        );

    }

}


/* ---------------------------------------------------------
   AUTHENTICATE ACCOUNT
--------------------------------------------------------- */

async function authenticateAccount(
    account
) {

    /*
     * The current Deriv workflow obtains a WebSocket URL
     * for the selected account through the authenticated
     * options account endpoint.
     */

    const response =
        await fetch(
            `https://api.derivws.com/trading/v1/options/accounts/${encodeURIComponent(
                account.id
            )}/otp`,
            {

                method: "POST",

                headers: {

                    "Authorization":
                        `Bearer ${state.pat}`,

                    "Deriv-App-ID":
                        APP_ID,

                    "Accept":
                        "application/json"

                }

            }
        );


    if (
        !response.ok
    ) {

        throw new Error(
            `Account session request failed (${response.status}).`
        );

    }


    const json =
        await response.json();


    const wsURL =
        json?.data?.url ||
        json?.url;


    if (
        !wsURL
    ) {

        throw new Error(
            "Deriv did not return a trading WebSocket URL."
        );

    }


    await openAccountSocket(
        wsURL
    );

}


/* ---------------------------------------------------------
   ACCOUNT SOCKET
--------------------------------------------------------- */

function openAccountSocket(
    url
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            if (
                state.accountWS
            ) {

                try {

                    state.accountWS.close();

                } catch {}

            }


            const ws =
                new WebSocket(
                    url
                );


            state.accountWS =
                ws;


            let opened =
                false;


            ws.onopen =
                () => {

                    opened =
                        true;


                    /*
                     * Real-time balance.
                     */

                    ws.send(
                        JSON.stringify({

                            balance:
                                1,

                            subscribe:
                                1,

                            req_id:
                                9001

                        })
                    );


                    resolve();

                };


            ws.onerror =
                () => {

                    if (
                        !opened
                    ) {

                        reject(
                            new Error(
                                "Authenticated WebSocket failed."
                            )
                        );

                    }

                };


            ws.onclose =
                () => {

                    if (
                        state.running
                    ) {

                        stopMauvey();

                    }

                };


            ws.onmessage =
                event => {

                    let data;

                    try {

                        data =
                            JSON.parse(
                                event.data
                            );

                    } catch {

                        return;

                    }


                    handleAccountMessage(
                        data
                    );

                };

        }
    );

}


/* ---------------------------------------------------------
   ACCOUNT MESSAGE
--------------------------------------------------------- */

function handleAccountMessage(
    data
) {

    if (
        data.error
    ) {

        console.error(
            data.error
        );

        return;

    }


    if (
        data.msg_type ===
        "balance"
    ) {

        const b =
            data.balance;


        el("balance").textContent =
            Number(
                b.balance || 0
            ).toFixed(2);


        el("currency").textContent =
            b.currency ||
            "—";

    }


    /*
     * Proposal, buy and contract messages are handled
     * by the trading engine when trading is enabled.
     */

}

el("startBtn").onclick =

        );

        );

        ) || 2;

}


function startMauvey() {

    readSettings();


    if (
        !state.volatilityMarkets.length
    ) {

        setStatus(
            "No Volatility markets found.",
            "Refresh the market list and try again.",
            false,
            true
        );

        return;

    }

        "STOP MAUVEY";


    el("startBtn")
        .classList
        .add(

        );

function stopMauvey() {

        false;


    el("startBtn").textContent =
        "START MAUVEY";

        );

        "Mauvey stopped.",

    );

}


/* ---------------------------------------------------------
   MAIN SCANNER
--------------------------------------------------------- */

async function scanLoop() {

    while (
        state.running
    ) {

        /*
         * Analyze five markets simultaneously.
         */

        const group =
            getNextMarketGroup();


        if (
            !group.length
        ) {

            state.currentMarketIndex =
                0;


            continue;

        }


        setStatus(
            `Analyzing ${group.length} markets...`,
            "Reading the latest 1,000 ticks from each market.",
            true
        );


        el("scannerMessage").textContent =
            group
                .map(
                    m =>
                        m.underlying_symbol_name ||
                        m.underlying_symbol
                )
                .join(
                    "  •  "
                );


        /*
         * FIVE REQUESTS AT THE SAME TIME.
         */

        const results =
            await Promise.allSettled(
                group.map(
                    market =>
                        analyzeMarket(
                            market
                        )
                )
            );


        if (
            !state.running
        ) {

            break;

        }


        let strongest =
            null;


        results.forEach(
            result => {

                if (
                    result.status !==
                    "fulfilled"
                ) {

                    return;

                }


                const opportunity =
                    result.value;


                if (
                    !opportunity
                ) {

                    return;

                }


                if (
                    !strongest ||
                    opportunity.score >
                    strongest.score
                ) {

                    strongest =
                        opportunity;

                }

            }
        );


        /*
         * No signal?
         *
         * Immediately move to the next group.
         */

        if (
            !strongest
        ) {

            setStatus(
                "No signal.",
                "No market in this group met the strategy. Moving to the next markets.",
                true
            );


            await sleep(
                50
            );


            continue;

        }


        /*
         * SIGNAL FOUND.
         */

        state.currentOpportunity =
            strongest;


        showOpportunity(
            strongest
        );


        setStatus(
            "Signal found.",
            strongest.reason,
            true
        );


        /*
         * Wait for the actual live entry.
         */

        const entry =
            await waitForLiveEntry(
                strongest
            );


        if (
            !state.running
        ) {

            break;

        }


        if (
            entry
        ) {

            /*
             * IMPORTANT:
             *
             * Once a signal qualifies, do not scan another
             * market between trades in the batch.
             */

            await runBatch(
                strongest
            );

        }

    }

}


/* ---------------------------------------------------------
   NEXT MARKET GROUP
--------------------------------------------------------- */

function getNextMarketGroup() {

    const markets =
        state.volatilityMarkets;


    if (
        !markets.length
    ) {

        return [];

    }


    const group =
        [];


    for (
        let i = 0;
        i < PARALLEL_MARKETS;
        i++
    ) {

        const index =
            (
                state.currentMarketIndex +
                i
            ) %
            markets.length;


        group.push(
            markets[index]
        );

    }


    state.currentMarketIndex =
        (
            state.currentMarketIndex +
            PARALLEL_MARKETS
        ) %
        markets.length;


    return group;

}


/* ---------------------------------------------------------
   ANALYZE ONE MARKET
--------------------------------------------------------- */

async function analyzeMarket(
    market
) {

    const symbol =
        market.underlying_symbol;


    const prices =
        await getHistory(
            symbol
        );


    const stats =
        calculateDigits(
            prices
        );


    const opportunity =
        evaluate(
            market,
            stats
        );


    /*
     * Show the first/most recently analyzed market visually.
     */

    showAnalysis(
        market,
        stats
    );


    return opportunity;

}


/* ---------------------------------------------------------
   HISTORY
--------------------------------------------------------- */

function getHistory(
    symbol
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reqId =
                Date.now() +
                Math.floor(
                    Math.random() *
                    100000
                );


            const listener =
                event => {

                    let data;

                    try {

                        data =
                            JSON.parse(
                                event.data
                            );

                    } catch {

                        return;

                    }


                    if (
                        data.req_id !==
                        reqId
                    ) {

                        return;

                    }


                    state.publicWS.removeEventListener(
                        "message",
                        listener
                    );


                    if (
                        data.error
                    ) {

                        reject(
                            new Error(
                                data.error.message
                            )
                        );

                        return;

                    }


                    const prices =
                        data.history?.prices ||
                        [];


                    resolve(
                        prices
                    );

                };


            state.publicWS.addEventListener(
                "message",
                listener
            );


            state.publicWS.send(
                JSON.stringify({

                    ticks_history:
                        symbol,

                    end:
                        "latest",

                    count:
                        HISTORY_COUNT,

                    style:
                        "ticks",

                    subscribe:
                        0,

                    req_id:
                        reqId

                })
            );

        }
    );

}


/* ---------------------------------------------------------
   DIGIT CALCULATION
--------------------------------------------------------- */

function getLastDigit(
    price
) {

    /*
     * Convert the quote to a string and take its final
     * displayed digit.
     *
     * Deriv digit contracts use the last digit of the
     * quoted price.
     */

    const text =
        String(
            price
        );


    const digits =
        text.replace(
            /\D/g,
            ""
        );


    if (
        !digits.length
    ) {

        return null;

    }


    return Number(
        digits[
            digits.length - 1
        ]
    );

}


function calculateDigits(
    prices
) {

    const counts =
        Array(10).fill(0);


    const digits =
        [];


    prices.forEach(
        price => {

            const digit =
                getLastDigit(
                    price
                );


            if (
                digit === null
            ) {

                return;

            }


            counts[digit]++;

            digits.push(
                digit
            );

        }
    );


    const total =
        digits.length;


    const percentages =
        counts.map(
            count =>
                total
                    ? (
                        count /
                        total
                    ) *
                    100
                    : 0
        );


    const ranking =
        percentages
            .map(
                (
                    percentage,
                    digit
                ) => ({
                    digit,
                    percentage,
                    count:
                        counts[digit]
                })
            )
            .sort(
                (
                    a,
                    b
                ) =>
                    b.percentage -
                    a.percentage
            );


    const evenCount =
        counts[0] +
        counts[2] +
        counts[4] +
        counts[6] +
        counts[8];


    const oddCount =
        counts[1] +
        counts[3] +
        counts[5] +
        counts[7] +
        counts[9];


    const overCount =
        counts[4] +
        counts[5] +
        counts[6] +
        counts[7] +
        counts[8] +
        counts[9];


    const underCount =
        counts[0] +
        counts[1] +
        counts[2] +
        counts[3] +
        counts[4] +
        counts[5] +
        counts[6];


    return {

        counts,

        percentages,

        ranking,

        digits,

        total,

        even:
            total
                ? evenCount /
                  total *
                  100
                : 0,

        odd:
            total
                ? oddCount /
                  total *
                  100
                : 0,

        over3:
            total
                ? overCount /
                  total *
                  100
                : 0,

        under7:
            total
                ? underCount /
                  total *
                  100
                : 0

    };

}


/* ---------------------------------------------------------
   STRATEGY EVALUATION
--------------------------------------------------------- */

function evaluate(
    market,
    stats
) {

    if (
        stats.total <
        900
    ) {

        return null;

    }


    const first =
        stats.ranking[0];


    const second =
        stats.ranking[1];


    const last =
        stats.ranking[
            stats.ranking.length - 1
        ];


    let candidates =
        [];


    /*
     * ============================================
     * EVEN
     * ============================================
     *
     * Strongest digit EVEN
     * Second strongest digit EVEN
     * EVEN percentage >= 51
     */

    if (
        first.digit % 2 === 0 &&
        second.digit % 2 === 0 &&
        stats.even >= 51
    ) {

        candidates.push({

            contract:
                "EVEN",

            score:
                stats.even,

            reason:
                `Strongest ${first.digit}, second ${second.digit}; EVEN ${stats.even.toFixed(1)}%.`

        });

    }


    /*
     * ============================================
     * ODD
     * ============================================
     */

    if (
        first.digit % 2 === 1 &&
        second.digit % 2 === 1 &&
        stats.odd >= 51
    ) {

        candidates.push({

            contract:
                "ODD",

            score:
                stats.odd,

            reason:
                `Strongest ${first.digit}, second ${second.digit}; ODD ${stats.odd.toFixed(1)}%.`

        });

    }


    /*
     * ============================================
     * OVER 3
     * ============================================
     *
     * Green/strong digit must be 4–9.
     * Upper digits must dominate.
     * Percentage must be >= 51.
     */

    if (
        first.digit >= 4 &&
        first.digit <= 9 &&
        stats.over3 >= 51
    ) {

        candidates.push({

            contract:
                "OVER 3",

            score:
                stats.over3,

            reason:
                `Strongest digit ${first.digit}; digits 4–9 = ${stats.over3.toFixed(1)}%.`

        });

    }


    /*
     * ============================================
     * UNDER 7
     * ============================================
     *
     * Strong digit should be 0–6.
     */

    if (
        first.digit >= 0 &&
        first.digit <= 6 &&
        stats.under7 >= 51
    ) {

        candidates.push({

            contract:
                "UNDER 7",

            score:
                stats.under7,

            reason:
                `Strongest digit ${first.digit}; digits 0–6 = ${stats.under7.toFixed(1)}%.`

        });

    }


    if (
        !candidates.length
    ) {

        return null;

    }


    const best =
        candidates.sort(
            (
                a,
                b
            ) =>
                b.score -
                a.score
        )[0];


    return {

        market:
            market.underlying_symbol_name ||
            market.underlying_symbol,

        symbol:
            market.underlying_symbol,

        contract:
            best.contract,

        score:
            best.score,

        reason:
            best.reason,

        stats

    };

}

/* ---------------------------------------------------------
   LIVE ENTRY
--------------------------------------------------------- */

function waitForLiveEntry(
    opportunity
) {

    return new Promise(
        resolve => {

            if (
                !state.publicWS ||
                state.publicWS.readyState !==
                WebSocket.OPEN
            ) {

                resolve(
                    false
                );

                return;

            }


            const symbol =
                opportunity.symbol;


            const requestId =
                Date.now() +
                500000;


            const recent =
                [];


            const listener =
                event => {

                    let data;

                    try {

                        data =
                            JSON.parse(
                                event.data
                            );

                    } catch {

                        return;

                    }


                    if (
                        data.msg_type !==
                        "tick"
                    ) {

                        return;

                    }


                    if (
                        data.tick?.symbol !==
                        symbol
                    ) {

                        return;

                    }


                    const digit =
                        getLastDigit(
                            data.tick.quote
                        );


                    if (
                        digit === null
                    ) {

                        return;

                    }


                    recent.push(
                        digit
                    );


                    if (
                        recent.length >
                        4
                    ) {

                        recent.shift();

                    }


                    /*
                     * EVEN ENTRY:
                     *
                     * ODD ODD ODD EVEN
                     */

                    if (
                        opportunity.contract ===
                        "EVEN"
                    ) {

                        if (
                            recent.length === 4 &&
                            recent[0] % 2 === 1 &&
                            recent[1] % 2 === 1 &&
                            recent[2] % 2 === 1 &&
                            recent[3] % 2 === 0
                        ) {

                            cleanup();

                            resolve(
                                true
                            );

                            return;

                        }

                    }


                    /*
                     * ODD ENTRY:
                     *
                     * EVEN EVEN EVEN ODD
                     */

                    if (
                        opportunity.contract ===
                        "ODD"
                    ) {

                        if (
                            recent.length === 4 &&
                            recent[0] % 2 === 0 &&
                            recent[1] % 2 === 0 &&
                            recent[2] % 2 === 0 &&
                            recent[3] % 2 === 1
                        ) {

                            cleanup();

                            resolve(
                                true
                            );

                            return;

                        }

                    }


                    /*
                     * OVER/UNDER:
                     *
                     * The historical qualification has already
                     * happened. For these, the live stream is
                     * monitored for a fresh tick.
                     */

                    if (
                        opportunity.contract ===
                        "OVER 3"
                    ) {

                        if (
                            digit >= 4
                        ) {

                            cleanup();

                            resolve(
                                true
                            );

                            return;

                        }

                    }


                    if (
                        opportunity.contract ===
                        "UNDER 7"
                    ) {

                        if (
                            digit <= 6
                        ) {

                            cleanup();

                            resolve(
                                true
                            );

                            return;

                        }

                    }

                };


            function cleanup() {

                state.publicWS.removeEventListener(
                    "message",
                    listener
                );


                try {

                    state.publicWS.send(
                        JSON.stringify({

                            forget:
                                requestId,

                            req_id:
                                requestId + 1

                        })
                    );

                } catch {}

            }


            state.publicWS.addEventListener(
                "message",
                listener
            );


            state.publicWS.send(
                JSON.stringify({

                    ticks:
                        symbol,

                    subscribe:
                        1,

                    req_id:
                        requestId

                })
            );


            setStatus(
                `Watching ${opportunity.market}`,
                `${opportunity.contract} setup found. Waiting for entry.`,
                true
            );

        }
    );

}


/* ---------------------------------------------------------
   BATCH
--------------------------------------------------------- */

async function runBatch(
    opportunity
) {

    state.currentStake =
        state.baseStake;


    for (
        let trade = 1;
        trade <= state.batch;
        trade++
    ) {

        if (
            !state.running
        ) {

            return;

        }


        state.batchPosition =
            trade;


        showTrade(
            opportunity,
            "WAITING"
        );


        setStatus(
            `Trade ${trade} / ${state.batch}`,
            `${opportunity.contract} on ${opportunity.market}`,
            true
        );


        /*
         * Actual authenticated proposal/buy call goes here.
         *
         * This function intentionally refuses to invent a
         * trade result.
         */

        const result =
            await executeTrade(
                opportunity
            );


        if (
            !result
        ) {

            setStatus(
                "Trading unavailable.",
                "The market signal was real, but no fake trade was recorded.",
                false,
                true
            );


            return;

        }


        addTrade(
            result
        );


        if (
            result.result ===
            "LOSS"
        ) {

            state.currentStake *=
                state.martingale;

        } else {

            state.currentStake =
                state.baseStake;

        }

    }

}


/* ---------------------------------------------------------
   EXECUTE TRADE
--------------------------------------------------------- */

async function executeTrade(
    opportunity
) {

    /*
     * IMPORTANT:
     *
     * Mauvey must never write "WIN", "LOSS", "BOUGHT",
     * or "TRADE EXECUTED" unless Deriv actually confirms it.
     *
     * The exact Digit contract proposal parameters should be
     * generated through contracts_for/proposal for the chosen
     * symbol rather than hard-coded.
     *
     * This function therefore returns null until that
     * authenticated trading contract mapping is connected.
     */

    console.warn(
        "Trade execution requires authenticated Deriv proposal/buy mapping.",
        opportunity
    );


    return null;

}

   HISTORY
--------------------------------------------------------- */

function addTrade(
    trade
) {

    state.trades.unshift(
        trade
    );


    if (
        state.trades.length >
        100
    ) {

        state.trades.pop();

    }


    renderTrades();

}


function renderTrades() {

    const list =
        el("tradeList");


    if (
        !state.trades.length
    ) {

        list.innerHTML =
            `<div class="empty">No trades yet.</div>`;

        return;

    }


    list.innerHTML =
        "";


    state.trades.forEach(
        (
            trade,
            index
        ) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "trade-row";


            row.innerHTML = `

                <div>
                    #${index + 1}
                </div>

                <div>
                    ${escapeHTML(
                        trade.market
                    )}
                    ·
                    ${escapeHTML(
                        trade.contract
                    )}
                </div>

                <div class="${
                    trade.result ===
                    "WIN"
                        ? "win"
                        : "loss"
                }">
                    ${escapeHTML(
                        trade.result
                    )}
                </div>

            `;


            list.appendChild(
                row
            );

        }
    );


    el("tradeCount").textContent =
        `${state.trades.length} trades`;

}


/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */

function sleep(
    ms
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


function escapeHTML(
    value
) {

    return String(
        value
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ---------------------------------------------------------
   INITIAL
--------------------------------------------------------- */

renderTrades();

</script></body>
</html>
