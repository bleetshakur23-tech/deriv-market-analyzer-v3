/*
============================================================
MAUVEY
============================================================

IMPORTANT:

This frontend does NOT contain a PAT.

The PAT is entered by the user and passed to the
authentication layer.

The App ID is kept here because it identifies the registered
application. The PAT must never be hard-coded.

CURRENT DERIV ARCHITECTURE:

PAT + App ID
        ↓
authenticated REST request
        ↓
account OTP
        ↓
authenticated WebSocket
        ↓
balance / portfolio / trading

PUBLIC MARKET DATA:

Public WebSocket
        ↓
active_symbols
        ↓
ticks_history
        ↓
live ticks

Mauvey's strategy layer will consume the market data.

============================================================
*/


const MAUVEY_APP_ID = "34fv9KSI5Got7lmvR0eqY";


const API_BASE =
  "https://api.derivws.com";


const PUBLIC_WS =
  "wss://api.derivws.com/trading/v1/options/ws/public";


const state = {

  connected: false,

  running: false,

  pat: "",

  accounts: [],

  selectedAccount: null,

  authenticatedWS: null,

  publicWS: null,

  balance: 0,

  currency: "",

  duration: 1,

  batchSize: 10,

  baseStake: 1,

  currentStake: 1,

  martingale: 2,

  batchNumber: 0,

  totalTrades: 0,

  trades: [],

  activeSymbols: [],

  volatilitySymbols: [],

  analysis: {},

  currentTrade: null

};


/* ============================================================
   ELEMENTS
============================================================ */

const patInput =
  document.getElementById("pat");

const connectButton =
  document.getElementById("connect");

const accountCard =
  document.getElementById("accountCard");

const accountsElement =
  document.getElementById("accounts");

const startButton =
  document.getElementById("start");

const balanceElement =
  document.getElementById("balance");

const currencyElement =
  document.getElementById("currency");

const connectionDot =
  document.getElementById("connectionDot");

const connectionText =
  document.getElementById("connectionText");

const statusDot =
  document.getElementById("statusDot");

const statusElement =
  document.getElementById("status");

const analysisElement =
  document.getElementById("analysis");

const analysisDetail =
  document.getElementById("analysisDetail");

const marketsElement =
  document.getElementById("markets");

const selectedMarketElement =
  document.getElementById("selectedMarket");

const selectedContractElement =
  document.getElementById("selectedContract");

const currentCard =
  document.getElementById("currentCard");

const tradeMarketElement =
  document.getElementById("tradeMarket");

const tradeContractElement =
  document.getElementById("tradeContract");

const tradeBatchElement =
  document.getElementById("tradeBatch");

const tradeStakeElement =
  document.getElementById("tradeStake");

const tradeResultElement =
  document.getElementById("tradeResult");

const tradeList =
  document.getElementById("tradeList");

const tradeCount =
  document.getElementById("tradeCount");

const strategyStatus =
  document.getElementById("strategyStatus");

const durationInput =
  document.getElementById("duration");

const batchInput =
  document.getElementById("batch");

const stakeInput =
  document.getElementById("stake");

const martingaleInput =
  document.getElementById("martingale");


/* ============================================================
   UI
============================================================ */

function setConnection(
  connected,
  message
) {

  state.connected = connected;

  connectionDot.classList.remove(
    "connected",
    "error"
  );

  if (connected) {

    connectionDot.classList.add(
      "connected"
    );

    connectionText.textContent =
      message || "Connected";

  } else {

    connectionText.textContent =
      message || "Not connected";

  }

}


function setError(
  message
) {

  statusDot.classList.remove(
    "active"
  );

  statusDot.classList.add(
    "error"
  );

  statusElement.textContent =
    message;

}


function setStatus(
  message,
  active = false
) {

  statusDot.classList.remove(
    "error"
  );

  if (active) {

    statusDot.classList.add(
      "active"
    );

  } else {

    statusDot.classList.remove(
      "active"
    );

  }

  statusElement.textContent =
    message;

}


function updateBalance(
  value,
  currency
) {

  state.balance =
    Number(value) || 0;

  if (currency) {

    state.currency =
      currency;

  }

  balanceElement.textContent =
    state.balance.toFixed(2);

  currencyElement.textContent =
    state.currency || "—";

}


function showAccountCard() {

  accountCard.classList.remove(
    "hidden"
  );

}


function renderAccounts() {

  accountsElement.innerHTML = "";

  state.accounts.forEach(
    account => {

      const button =
        document.createElement("button");

      button.className =
        "account-button";

      if (
        state.selectedAccount &&
        state.selectedAccount.accountId ===
        account.accountId
      ) {

        button.classList.add(
          "active"
        );

      }

      const type =
        document.createElement("div");

      type.className =
        "account-type";

      type.textContent =
        account.type === "demo"
          ? "DEMO"
          : "REAL";


      const id =
        document.createElement("div");

      id.className =
        "account-id";

      id.textContent =
        account.accountId;


      button.appendChild(type);

      button.appendChild(id);


      button.addEventListener(
        "click",
        () => {

          selectAccount(
            account
          );

        }
      );


      accountsElement.appendChild(
        button
      );

    }
  );

}


function selectAccount(
  account
) {

  state.selectedAccount =
    account;

  renderAccounts();

  setStatus(
    `Selected ${account.type.toUpperCase()} account.`
  );

  startButton.disabled =
    !state.connected;

}


/* ============================================================
   AUTHENTICATION
============================================================ */

connectButton.addEventListener(
  "click",
  connectToDeriv
);


async function connectToDeriv() {

  const pat =
    patInput.value.trim();

  if (!pat) {

    setError(
      "Enter your PAT."
    );

    return;

  }

  connectButton.disabled =
    true;

  setStatus(
    "Authenticating with Deriv...",
    true
  );

  try {

    /*
     * The current API requires:
     *
     * Authorization: Bearer PAT
     * Deriv-App-ID: App ID
     *
     * to access authenticated REST endpoints.
     */


    state.pat =
      pat;


    const response =
      await fetch(
        `${API_BASE}/trading/v1/options/accounts`,
        {
          method: "GET",

          headers: {

            "Authorization":
              `Bearer ${pat}`,

            "Deriv-App-ID":
              MAUVEY_APP_ID,

            "Content-Type":
              "application/json"

          }
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        `Authentication failed (${response.status}). ${errorText}`
      );

    }


    const result =
      await response.json();


    /*
     * The exact account list returned by the current API
     * is normalized here so the UI can work with demo/real.
     */

    state.accounts =
      normalizeAccounts(
        result
      );


    if (
      state.accounts.length === 0
    ) {

      throw new Error(
        "No trading accounts were returned."
      );

    }


    showAccountCard();

    renderAccounts();


    /*
     * Prefer demo if available.
     */

    const demo =
      state.accounts.find(
        account =>
          account.type === "demo"
      );


    selectAccount(
      demo ||
      state.accounts[0]
    );


    setConnection(
      true,
      "Authenticated"
    );


    setStatus(
      "Choose your account.",
      false
    );


    /*
     * Open public market-data connection.
     *
     * Market data does not require authentication.
     */

    await connectPublicMarketData();


  } catch (error) {

    console.error(
      "Mauvey authentication error:",
      error
    );

    setConnection(
      false,
      "Connection failed"
    );

    setError(
      error.message ||
      "Unable to connect."
    );

  } finally {

    connectButton.disabled =
      false;

  }

}


/*
 * Normalize account responses.
 *
 * We deliberately keep this flexible because the API response
 * may contain account information in different nested forms.
 */

function normalizeAccounts(
  response
) {

  const source =
    response?.data ||
    response?.accounts ||
    response;


  if (
    !Array.isArray(source)
  ) {

    return [];

  }


  return source
    .map(account => {

      const accountId =
        account.account_id ||
        account.accountId ||
        account.id;


      if (!accountId) {

        return null;

      }


      const accountType =
        String(
          account.account_type ||
          account.type ||
          ""
        ).toLowerCase();


      return {

        accountId,

        type:
          accountType.includes(
            "demo"
          )
            ? "demo"
            : "real",

        currency:
          account.currency ||
          account.currency_code ||
          ""

      };

    })
    .filter(Boolean);

}


/* ============================================================
   ACCOUNT WEBSOCKET
============================================================ */

async function connectAuthenticatedAccount() {

  if (
    !state.selectedAccount
  ) {

    throw new Error(
      "Select a Demo or Real account first."
    );

  }


  setStatus(
    "Authorizing selected account...",
    true
  );


  /*
   * Current Deriv flow:
   *
   * POST
   * /trading/v1/options/accounts/{accountId}/otp
   *
   * The response contains the ready-to-use WebSocket URL.
   */


  const response =
    await fetch(
      `${API_BASE}/trading/v1/options/accounts/${encodeURIComponent(
        state.selectedAccount.accountId
      )}/otp`,
      {

        method: "POST",

        headers: {

          "Authorization":
            `Bearer ${state.pat}`,

          "Deriv-App-ID":
            MAUVEY_APP_ID,

          "Content-Type":
            "application/json"

        }

      }
    );


  if (!response.ok) {

    const errorText =
      await response.text();

    throw new Error(
      `Account authorization failed (${response.status}). ${errorText}`
    );

  }


  const result =
    await response.json();


  const websocketURL =
    result?.data?.url ||
    result?.url;


  if (!websocketURL) {

    throw new Error(
      "Deriv did not return an authenticated WebSocket URL."
    );

  }


  await openAuthenticatedWebSocket(
    websocketURL
  );

}


function openAuthenticatedWebSocket(
  url
) {

  return new Promise(
    (resolve, reject) => {

      const ws =
        new WebSocket(url);


      state.authenticatedWS =
        ws;


      let opened =
        false;


      ws.onopen =
        () => {

          opened =
            true;

          /*
           * Subscribe to the real account balance.
           */

          ws.send(
            JSON.stringify({
              balance: 1,
              subscribe: 1,
              req_id: 1001
            })
          );


          setConnection(
            true,
            state.selectedAccount.type ===
            "demo"
              ? "Demo connected"
              : "Real connected"
          );


          setStatus(
            "Account connected. Balance loading...",
            true
          );


          resolve();

        };


      ws.onmessage =
        event => {

          let data;

          try {

            data =
              JSON.parse(
                event.data
              );

          } catch {

            return;

          }


          handleAuthenticatedMessage(
            data
          );

        };


      ws.onerror =
        error => {

          console.error(
            "Authenticated WebSocket error:",
            error
          );


          if (!opened) {

            reject(
              new Error(
                "Authenticated WebSocket connection failed."
              )
            );

          }

        };


      ws.onclose =
        () => {

          state.authenticatedWS =
            null;

          if (
            state.running
          ) {

            stopMauvey();

          }


          setConnection(
            false,
            "Disconnected"
          );

          setStatus(
            "Account connection closed."
          );

        };

    }
  );

}


function handleAuthenticatedMessage(
  data
) {

  if (
    data.error
  ) {

    console.error(
      "Deriv error:",
      data.error
    );


    setError(
      data.error.message ||
      "Deriv returned an error."
    );

    return;

  }


  if (
    data.msg_type ===
    "balance"
  ) {

    const balance =
      data.balance;


    updateBalance(
      balance?.balance ??
      balance?.amount ??
      0,

      balance?.currency ??
      state.selectedAccount?.currency ??
      ""
    );


    setStatus(
      "Account connected and balance live.",
      false
    );

    startButton.disabled =
      false;

    return;

  }


  if (
    data.msg_type ===
    "buy"
  ) {

    handleBuyResponse(
      data
    );

    return;

  }


  if (
    data.msg_type ===
    "proposal"
  ) {

    handleProposal(
      data
    );

    return;

  }


  if (
    data.msg_type ===
    "proposal_open_contract"
  ) {

    handleContractUpdate(
      data
    );

  }

}

   PUBLIC MARKET DATA
============================================================ */

function connectPublicMarketData() {

  return new Promise(
    (resolve, reject) => {

      const ws =
        new WebSocket(
          PUBLIC_WS
        );


      state.publicWS =
        ws;


      ws.onopen =
        () => {

          ws.send(
            JSON.stringify({

              active_symbols:
                "brief",

              product_type:
                "basic",

              req_id:
                2001

            })
          );

          resolve();

        };


      ws.onmessage =
        event => {

          let data;

          try {

            data =
              JSON.parse(
                event.data
              );

          } catch {

            return;

          }


          handlePublicMessage(
            data
          );

        };


      ws.onerror =
        error => {

          console.error(
            "Public market WebSocket:",
            error
          );

          reject(
            new Error(
              "Market-data connection failed."
            )
          );

        };

    }
  );

}


function handlePublicMessage(
  data
) {

  if (
    data.error
  ) {

    console.error(
      data.error
    );

    return;

  }


  if (
    data.msg_type ===
    "active_symbols"
  ) {

    state.activeSymbols =
      data.active_symbols ||
      [];


    /*
     * Automatically identify Volatility Indices.
     *
     * No market selector is shown to the user.
     */

    state.volatilitySymbols =
      state.activeSymbols.filter(
        symbol => {

          const name =
            String(
              symbol.underlying_symbol_name ||
              ""
            ).toLowerCase();

          const code =
            String(
              symbol.underlying_symbol ||
              ""
            ).toUpperCase();


          return (
            name.includes(
              "volatility"
            ) ||
            code.includes(
              "1HZ"
            ) ||
            code.includes(
              "R_"
            )
          );

        }
      );


    marketsElement.textContent =
      state.volatilitySymbols.length;


    analysisDetail.textContent =
      `${state.volatilitySymbols.length} Volatility markets available for automatic analysis.`;

  }

}

function readSettings() {

  state.duration =
    Math.max(
      1,
      Math.min(
        100,
        Number(
          durationInput.value
        ) || 1
      )
    );


  state.batchSize =
    Math.max(
      1,
      Math.min(
        100,
        Number(
          batchInput.value
        ) || 10
      )
    );


  state.baseStake =
    Math.max(
      0.01,
      Number(
        stakeInput.value
      ) || 1
    );


  state.martingale =
    Number(
      martingaleInput.value
    ) || 2;


  state.currentStake =
    state.baseStake;

}

startButton.addEventListener(

function startMauvey() {

  state.running =
    true;

  state.batchNumber =
    0;

  state.currentStake =
    state.baseStake;

  startButton.textContent =

  startButton.classList.add(

  );

function stopMauvey() {

/* ============================================================
   ANALYSIS CYCLE
============================================================ */

async function runAnalysisCycle() {

  if (
    !state.running
  ) {

    return;

  }


  try {

    analysisElement.textContent =
      "Analyzing all Volatility markets...";


    analysisDetail.textContent =
      "Reading the latest 1,000 ticks for each candidate market.";


    strategyStatus.textContent =
      "Analyzing";


    /*
     * The strategy engine will automatically select a market.
     *
     * It does NOT ask the user to choose a market.
     */

    const opportunity =
      await analyzeAllVolatilityMarkets();


    if (
      !state.running
    ) {

      return;

    }


    if (!opportunity) {

      analysisElement.textContent =
        "No qualifying setup found.";

      analysisDetail.textContent =
        "Mauvey will continue scanning automatically.";

      strategyStatus.textContent =
        "Scanning";


      setStatus(
        "No valid setup. Continuing analysis...",
        true
      );


      setTimeout(
        runAnalysisCycle,
        1200
      );


      return;

    }


    state.analysis =
      opportunity;


    selectedMarketElement.textContent =
      opportunity.market;


    selectedContractElement.textContent =
      opportunity.contract;


    analysisElement.textContent =
      "Valid setup found.";


    analysisDetail.textContent =
      opportunity.reason ||
      "Strategy conditions satisfied.";


    strategyStatus.textContent =
      "Setup found";


    setStatus(
      `${opportunity.market} selected. Starting batch.`,
      true
    );


    await executeBatch(
      opportunity
    );


    if (
      state.running
    ) {

      setStatus(
        "Batch complete. Re-analyzing...",
        true
      );


      setTimeout(
        runAnalysisCycle,
        500
      );

    }

  } catch (error) {

    console.error(
      "Analysis cycle error:",
      error
    );


    if (
      state.running
    ) {

      setError(
        error.message ||
        "Analysis error."
      );

      setTimeout(
        runAnalysisCycle,
        2000
      );

    }

  }

}


/* ============================================================
   1,000-TICK MARKET ANALYSIS
============================================================ */

async function analyzeAllVolatilityMarkets() {

  /*
   * IMPORTANT:
   *
   * This is NOT the user's contract-duration setting.
   *
   * Mauvey internally analyzes 1,000 historical ticks.
   */


  const candidates =
    state.volatilitySymbols;


  if (
    !candidates.length
  ) {

    return null;

  }


  /*
   * For now this function obtains real historical tick data.
   *
   * The final strategy evaluator below decides whether a market
   * satisfies EVEN / ODD / OVER 3 / UNDER 7.
   */


  let bestOpportunity =
    null;


  let scanned =
    0;


  for (
    const symbol of candidates
  ) {

    if (
      !state.running
    ) {

      break;

    }


    const symbolCode =
      symbol.underlying_symbol;


    if (
      !symbolCode
    ) {

      continue;

    }


    try {

      const ticks =
        await getHistoricalTicks(
          symbolCode,
          1000
        );


      if (
        !ticks.length
      ) {

        continue;

      }


      scanned++;


      const analysis =
        analyzeDigits(
          ticks
        );


      /*
       * Strategy evaluation.
       *
       * This is deliberately separated from the market
       * selection mechanism so your final strategy rules can
       * be tightened without changing the UI.
       */

      const opportunity =
        evaluateMauveyStrategy(
          symbol,
          ticks,
          analysis
        );


      if (
        opportunity
      ) {

        if (
          !bestOpportunity ||
          opportunity.score >
          bestOpportunity.score
        ) {

          bestOpportunity =
            opportunity;

        }

      }

    } catch (
      error
    ) {

      console.warn(
        "Could not analyze",
        symbolCode,
        error
      );

    }

  }


  marketsElement.textContent =
    scanned;


  return bestOpportunity;

}


/* ============================================================
   HISTORICAL TICKS
============================================================ */

function getHistoricalTicks(
  symbol,
  count
) {

  return new Promise(
    (resolve, reject) => {

      if (
        !state.publicWS ||
        state.publicWS.readyState !==
        WebSocket.OPEN
      ) {

        reject(
          new Error(
            "Public market connection is not available."
          )
        );

        return;

      }


      const requestId =
        Date.now() +
        Math.floor(
          Math.random() * 1000
        );


      const handler =
        event => {

          let data;

          try {

            data =
              JSON.parse(
                event.data
              );

          } catch {

            return;

          }


          if (
            data.req_id !==
            requestId
          ) {

            return;

          }


          state.publicWS.removeEventListener(
            "message",
            handler
          );


          if (
            data.error
          ) {

            reject(
              new Error(
                data.error.message ||
                "Tick history error."
              )
            );

            return;

          }


          const history =
            data.history;


          if (
            history &&
            Array.isArray(
              history.prices
            )
          ) {

            resolve(
              history.prices
            );

          } else {

            resolve([]);

          }

        };


      state.publicWS.addEventListener(
        "message",
        handler
      );


      state.publicWS.send(
        JSON.stringify({

          ticks_history:
            symbol,

          count:
            count,

          end:
            "latest",

          style:
            "ticks",

          req_id:
            requestId

        })
      );

    }
  );

}


/* ============================================================
   DIGIT ANALYSIS
============================================================ */

function extractLastDigit(
  value
) {

  const text =
    String(value);


  /*
   * Remove decimal point and find the final numeric digit.
   *
   * The strategy operates on the final digit of the quote.
   */

  const digits =
    text.replace(
      /\D/g,
      ""
    );


  if (!digits) {

    return null;

  }


  return Number(
    digits[
      digits.length - 1
    ]
  );

}


function analyzeDigits(
  prices
) {

  const counts =
    Array(10).fill(0);


  let valid =
    0;


  prices.forEach(
    price => {

      const digit =
        extractLastDigit(
          price
        );


      if (
        digit === null
      ) {

        return;

      }


      counts[digit]++;

      valid++;

    }
  );


  const percentages =
    counts.map(
      count =>
        valid
          ? (
              count /
              valid
            ) *
            100
          : 0
    );


  const ranked =
    percentages
      .map(
        (percentage, digit) => ({
          digit,
          percentage,
          count:
            counts[digit]
        })
      )
      .sort(
        (a, b) =>
          b.percentage -
          a.percentage
      );


  const evenCount =
    counts[0] +
    counts[2] +
    counts[4] +
    counts[6] +
    counts[8];


  const oddCount =
    counts[1] +
    counts[3] +
    counts[5] +
    counts[7] +
    counts[9];


  return {

    counts,

    percentages,

    ranked,

    evenPercentage:
      valid
        ? (
            evenCount /
            valid
          ) *
          100
        : 0,

    oddPercentage:
      valid
        ? (
            oddCount /
            valid
          ) *
          100
        : 0,

    valid

  };

}


/* ============================================================
   MAUVEY STRATEGY
============================================================ */

function evaluateMauveyStrategy(
  symbol,
  prices,
  analysis
) {

  /*
   * EVEN
   *
   * - strongest digit is even
   * - second strongest digit is even
   * - even percentage >= 51%
   *
   * Entry pattern is checked from live ticks separately:
   * ODD ODD ODD -> EVEN
   */


  const strongest =
    analysis.ranked[0];


  const second =
    analysis.ranked[1];


  if (
    strongest &&
    second &&
    strongest.digit % 2 === 0 &&
    second.digit % 2 === 0 &&
    analysis.evenPercentage >= 51
  ) {

    return {

      market:
        symbol.underlying_symbol_name ||
        symbol.underlying_symbol,

      symbol:
        symbol.underlying_symbol,

      contract:
        "EVEN",

      score:
        analysis.evenPercentage,

      reason:
        `Strongest digits ${strongest.digit} and ${second.digit} are even; EVEN ${analysis.evenPercentage.toFixed(1)}%.`

    };

  }


  /*
   * ODD
   */


  if (
    strongest &&
    second &&
    strongest.digit % 2 === 1 &&
    second.digit % 2 === 1 &&
    analysis.oddPercentage >= 51
  ) {

    return {

      market:
        symbol.underlying_symbol_name ||
        symbol.underlying_symbol,

      symbol:
        symbol.underlying_symbol,

      contract:
        "ODD",

      score:
        analysis.oddPercentage,

      reason:
        `Strongest digits ${strongest.digit} and ${second.digit} are odd; ODD ${analysis.oddPercentage.toFixed(1)}%.`

    };

  }


  /*
   * OVER 3
   *
   * Winning digits:
   * 4,5,6,7,8,9
   *
   * We require the combined upper group to be at least 51%.
   */


  const overDigits =
    [4,5,6,7,8,9];


  const overPercentage =
    overDigits.reduce(
      (
        total,
        digit
      ) =>
        total +
        analysis.percentages[digit],
      0
    );


  const strongestIsOver =
    strongest &&
    overDigits.includes(
      strongest.digit
    );


  if (
    overPercentage >= 51 &&
    strongestIsOver
  ) {

    return {

      market:
        symbol.underlying_symbol_name ||
        symbol.underlying_symbol,

      symbol:
        symbol.underlying_symbol,

      contract:
        "OVER 3",

      score:
        overPercentage,

      reason:
        `Upper digits 4–9 account for ${overPercentage.toFixed(1)}% of the analyzed ticks.`

    };

  }


  /*
   * UNDER 7
   *
   * Winning digits:
   * 0,1,2,3,4,5,6
   */


  const underDigits =
    [0,1,2,3,4,5,6];


  const underPercentage =
    underDigits.reduce(
      (
        total,
        digit
      ) =>
        total +
        analysis.percentages[digit],
      0
    );


  const strongestIsUnder =
    strongest &&
    underDigits.includes(
      strongest.digit
    );


  if (
    underPercentage >= 51 &&
    strongestIsUnder
  ) {

    return {

      market:
        symbol.underlying_symbol_name ||
        symbol.underlying_symbol,

      symbol:
        symbol.underlying_symbol,

      contract:
        "UNDER 7",

      score:
        underPercentage,

      reason:
        `Lower digits 0–6 account for ${underPercentage.toFixed(1)}% of the analyzed ticks.`

    };

  }


  return null;

}


/* ============================================================
   BATCH EXECUTION
============================================================ */

async function executeBatch(
  opportunity
) {

  state.batchNumber =
    0;

  state.currentStake =
    state.baseStake;


  for (
    let i = 1;
    i <= state.batchSize;
    i++
  ) {

    if (
      !state.running
    ) {

      return;

    }


    state.batchNumber =
      i;


    updateCurrentTrade(
      opportunity,
      "WAITING"
    );


    /*
     * IMPORTANT:
     *
     * Mauvey does NOT re-analyze the market here.
     *
     * The same opportunity is used throughout the batch.
     */


    setStatus(
      `Executing trade ${i} of ${state.batchSize}...`,
      true
    );


    const result =
      await executeRealTrade(
        opportunity
      );


    if (
      !state.running
    ) {

      return;

    }


    addTrade({

      market:
        opportunity.market,

      contract:
        opportunity.contract,

      stake:
        state.currentStake,

      result:
        result.result,

      profit:
        result.profit

    });


    if (
      typeof result.balance !==
      "undefined"
    ) {

      updateBalance(
        result.balance,
        result.currency
      );

    }


    updateCurrentTrade(
      opportunity,
      result.result
    );


    /*
     * Martingale:
     *
     * LOSS → stake ×2
     * WIN → reset to base stake
     */

    if (
      result.result ===
      "LOSS"
    ) {

      state.currentStake *=
        state.martingale;

    }


    if (
      result.result ===
      "WIN"
    ) {

      state.currentStake =
        state.baseStake;

    }

  }

}


/* ============================================================
   REAL TRADE
============================================================ */

async function executeRealTrade(
  opportunity
) {

  /*
   * This function is intentionally separated from the strategy.
   *
   * The final contract mapping for EVEN/ODD/OVER 3/UNDER 7
   * must use the exact contract/proposal schema supported by
   * the selected Deriv Options account.
   *
   * We do NOT fabricate a contract type here.
   */


  if (
    !state.authenticatedWS ||
    state.authenticatedWS.readyState !==
    WebSocket.OPEN
  ) {

    throw new Error(
      "Authenticated Deriv account connection is not open."
    );

  }


  /*
   * Proposal creation and buy happen here.
   *
   * The proposal response provides the proposal ID.
   * buy then purchases that proposal.
   *
   * proposal_open_contract monitors the purchased contract.
   */


  throw new Error(
    "Trade execution mapping is not enabled yet. No fake trade will be placed."
  );

}

/* ============================================================
   CURRENT TRADE UI
============================================================ */

function updateCurrentTrade(
  opportunity,
  result
) {

  currentCard.classList.remove(
    "hidden"
  );


  tradeMarketElement.textContent =
    opportunity.market;


  tradeContractElement.textContent =
    opportunity.contract;


  tradeBatchElement.textContent =
    `${state.batchNumber} / ${state.batchSize}`;


  tradeStakeElement.textContent =
    `${state.currentStake.toFixed(2)} ${state.currency || ""}`;


  tradeResultElement.textContent =
    result;


  tradeResultElement.classList.remove(
    "win",
    "loss",
    "pending"
  );


  if (
    result ===
    "WIN"
  ) {

    tradeResultElement.classList.add(
      "win"
    );

  } else if (
    result ===
    "LOSS"
  ) {

    tradeResultElement.classList.add(
      "loss"
    );

  } else {

    tradeResultElement.classList.add(
      "pending"
    );

  }

}


/* ============================================================
   TRADE HISTORY
============================================================ */

function addTrade(
  trade
) {

  state.totalTrades++;


  state.trades.unshift({

    number:
      state.totalTrades,

    ...trade

  });


  if (
    state.trades.length >
    100
  ) {

    state.trades =
      state.trades.slice(
        0,
        100
      );

  }


  renderTrades();

}


function renderTrades() {

  tradeList.innerHTML = "";


  tradeCount.textContent =
    `${state.trades.length} trades`;


  if (
    !state.trades.length
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "empty";

    empty.textContent =
      "No trades yet.";

    tradeList.appendChild(
      empty
    );

    return;

  }


  state.trades.forEach(
    trade => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "trade-row";


      const number =
        document.createElement(
          "div"
        );

      number.className =
        "trade-number";

      number.textContent =
        `#${trade.number}`;


      const contract =
        document.createElement(
          "div"
        );

      contract.className =
        "trade-contract";

      contract.textContent =
        `${trade.market} · ${trade.contract}`;


      const result =
        document.createElement(
          "div"
        );

      result.textContent =
        trade.result;


      if (
        trade.result ===
        "WIN"
      ) {

        result.className =
          "win";

      } else if (
        trade.result ===
        "LOSS"
      ) {

        result.className =
          "loss";

      } else {

        result.className =
          "pending";

      }


      const profit =
        document.createElement(
          "div"
        );


      const amount =
        Number(
          trade.profit
        ) || 0;


      profit.textContent =
        `${amount >= 0 ? "+" : ""}${amount.toFixed(2)}`;


      profit.className =
        amount >= 0
          ? "win"
          : "loss";


      row.appendChild(
        number
      );

      row.appendChild(
        contract
      );

      row.appendChild(
        result
      );

      row.appendChild(
        profit
      );


      tradeList.appendChild(
        row
      );

    }
  );

}


/* ============================================================
   INITIALIZE
============================================================ */

renderTrades();

setConnection(
  false,
  "Not connected"
);

setStatus(
